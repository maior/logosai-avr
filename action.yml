name: AVR audit
description: Audit a deployed site with the AVR public API; fail only when a blocking item (e.g. AI-crawler access) breaks.
inputs:
  url:
    description: URL to audit
    required: true
  api-key:
    description: AVR API key (aeo_…). Pass it as a repository secret
    required: true
  api-base:
    description: AVR API base URL
    required: true
  min-score:
    description: Optional. Fail if ARS is below this. Empty = blocking items only
    required: false
    default: ""
  timeout-seconds:
    description: Maximum seconds to wait for the result
    required: false
    default: "600"
outputs:
  score:
    description: ARS (None when the site could not be scored)
    value: ${{ steps.audit.outputs.score }}
  job_id:
    description: Job id — full result at GET /v1/audits/{id}
    value: ${{ steps.audit.outputs.job_id }}
runs:
  using: composite
  steps:
    - id: audit
      shell: bash
      run: python3 "${{ github.action_path }}/avr_audit.py"
      env:
        AVR_URL: ${{ inputs.url }}
        AVR_API_KEY: ${{ inputs.api-key }}
        AVR_API_BASE: ${{ inputs.api-base }}
        AVR_MIN_SCORE: ${{ inputs.min-score }}
        AVR_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
