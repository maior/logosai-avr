# P1-06 서버 응답 속도 (TTFB)
#
# `infra` 분류. 붙여넣을 코드가 없고, 우리가 검증할 수도 없다 — 픽스처는 실제 서버
# 시간을 만들지 못한다.

item_id: P1-06

target_state: |
  대표 URL 집합의 **중앙값 TTFB 600ms 이하**, 최대값도 2000ms 이하.

  중앙값과 최대값을 함께 보는 이유: 평균은 느린 한 페이지를 빠른 여러 페이지가 가린다.
  크롤러는 느린 페이지에서 예산을 쓰고 나머지를 덜 가져간다.

steps:
  - "TTFB 를 페이지별로 잰다 — `curl -w '%{time_starttransfer}' -o /dev/null -s <URL>`.
    브라우저 개발자도구의 숫자는 캐시·확장·로컬 네트워크가 섞여 있어 다르다."
  - "느린 페이지가 특정 경로에 몰려 있는지 본다. 전 페이지가 고르게 느리면 호스팅·
    지역 문제이고, 몇 개만 느리면 그 페이지의 질의·외부 API 호출이 원인이다."
  - "가장 흔한 둘을 먼저 본다 — (1) 매 요청마다 도는 DB 질의나 외부 API,
    (2) 캐시 헤더 없음. 목록·검색 페이지가 대개 여기 걸린다."
  - "CDN 이 없으면 정적 자산부터 올린다. 문서 자체를 엣지에서 캐시할 수 있으면
    TTFB 는 대개 한 자릿수 ms 로 떨어진다."
  - "고친 뒤 재측정한다. **한 번 재고 끝내지 않는다** — TTFB 는 시간대에 따라 흔들려서
    한 번 잰 값으로는 중앙값을 말할 수 없다."

not_verifiable: |
  **픽스처로는 확인할 수 없다.** 이 항목이 재는 것은 실제 네트워크·서버 시간인데,
  고정 응답 픽스처는 즉시 답하므로 언제나 만점이 나온다. 그건 측정이 아니라 자기
  픽스처의 속도를 재는 것이다.

  실측으로 확인했다 — 정적 픽스처에서 수집기는 `inconclusive` 를 낸다
  ("응답 시간을 잰 페이지가 0개뿐이라 중앙값에 의미가 없습니다").

  느린 응답을 흉내내는 픽스처(sleep 주입)를 만들 수는 있지만, 그건 **우리가 정한
  지연이 우리가 정한 문턱을 넘는지** 확인하는 것이라 처방에 대해 아무것도 말하지
  않는다. 그래서 하지 않는다.

adapters:
  - platform: any
    where: "호스팅·CDN 설정. 코드가 아니라 인프라다"
    status: unconfirmed
    note: "어느 환경에도 적용해 재진단한 적 없다"
