# P2-05 한국어 문장 길이
#
# **이 처방은 붙여넣는 것이 아니다.** 아래 `example` 은 채워진 예시이고, 당신의
# 글은 당신이 써야 한다. 우리가 확인할 수 있는 것은 하나뿐이다 -- 이 **틀이 2점에
# 닿을 수 있다**. 당신 글이 2점이 된다는 뜻이 아니다.

item_id: P2-05

target_state: |
  본문 문장의 **평균 어절 수가 18 이하**이고, **40어절을 넘는 문장이 5% 미만**이다.

  어절은 공백으로 나눈 토큰이다. 영어 단어 수 기준을 그대로 쓰지 않는 이유는
  조사·어미 때문이다 -- 같은 내용을 한국어로 쓰면 토큰 수가 다르게 잡힌다
  (spec `plane-b-readiness.md` §6).

  긴 문장은 대개 **접속 어미로 이어붙인 것**이다. '~하고', '~하며', '~인데',
  '~지만' 에서 끊으면 대부분 두세 문장이 된다.

    · 전: 재고관리 시스템을 도입하면 창고별 재고를 실시간으로 확인할 수 있고
          발주 시점을 자동으로 알려주며 엑셀로 관리할 때 생기던 입력 누락도
          줄어드는데 특히 창고가 여러 곳인 경우에 효과가 크다. (39어절)
    · 후: 재고관리 시스템을 도입하면 창고별 재고를 실시간으로 확인할 수 있다.
          발주 시점도 자동으로 알려준다. 엑셀로 관리할 때 생기던 입력 누락이
          줄어든다. 창고가 여러 곳일수록 효과가 크다.

  평균을 18 이하로 **맞추려고** 모든 문장을 토막 낼 필요는 없다. 긴 문장 몇 개가
  평균을 끌어올리므로, 가장 긴 것부터 끊는 편이 싸다.

example: |
  <h1>재고 실사 절차</h1>
  <p>재고 실사는 분기에 한 번 한다. 창고를 구역으로 나눠 두 명이 한 조로 센다. 센 값과 장부 값이 다르면 그 자리에서 차이를 적는다.</p>
  <h2>차이가 났을 때</h2>
  <p>차이의 원인은 대개 세 가지다. 입고 누락, 출고 중복, 파손이다. 원인마다 확인할 담당 부서가 다르므로 먼저 분류하고 넘긴다.</p>
  <h2>기록 방법</h2>
  <p>실사표는 창고 구역 단위로 만든다. 한 줄에 품목 하나만 적는다. 서명은 함께 센 조원 두 명이 모두 한다.</p>

not_verifiable: null

verify:
  collector: StructureCollector
  demonstrates_level: 2
  note: |
    골든 케이스 `remedy-p2-05-example-demonstrates-two` 가 **이 파일을 직접 읽어**
    돌린다. 문장들을 접속 어미로 다시 이어붙여 평균 어절을 18 위로 올리면 그
    케이스가 빨개진다.

    `target_state` 의 '전/후' 대비 문장은 주석이 아니라 본문 설명이라 판정에
    들어가지 않는다 -- 판정 대상은 `example` 뿐이다.

