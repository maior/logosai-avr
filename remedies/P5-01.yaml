# P5-01 발행일 표기
#
# **`<head>` 에 넣으면 안 되는 처방이다.** level 2 조건이 "화면 표시 **+** 마크업"
# 이므로 마크업만으로는 절반이다. 그래서 이 산출물은 본문에 놓이고(fixture.place: body),
# 화면에 보이는 `<time>` 과 JSON-LD 를 한 덩어리로 준다.
#
# 두 자리에 같은 날짜를 손으로 두 번 적는 구조가 곧 결함의 원인이다 -- 하나만 고치면
# 둘이 갈라진다. 그래서 placeholder 를 **하나로** 뒀다: 한 값이 두 자리를 채운다.

item_id: P5-01

target_state: |
  문서에 발행일이 **화면과 마크업 양쪽에 있고 두 값이 일치**한다.

    화면: `<time datetime="…">` 로 사람이 읽는 표기
    마크업: `datePublished`(ISO 8601) — JSON-LD 또는 `<time datetime>` 속성

  "일치" 가 조건인 이유: 화면에만 있으면 기계가 못 읽고, 마크업에만 있으면 사람이
  못 읽는다. 둘이 다르면 **어느 쪽이 거짓인지 알 수 없고**, 그 상태는 둘 다 없는
  것보다 신뢰를 더 깎는다.

  `<time datetime>` 을 쓰는 이유: 화면 표기를 `2026년 1월 15일` 처럼 현지화해도
  `datetime` 속성이 ISO 값을 들고 있어 한 자리에서 둘을 만족시킨다. 화면 문자열과
  속성의 날짜가 같기만 하면 표기 형식은 자유다.

  **발행일을 지어내지 마라.** 오래된 글의 날짜를 지우거나 오늘로 바꾸는 것은 신선도
  신호를 만드는 것이 아니라 문서의 이력을 지우는 것이고, dateModified(P5-02)와 대조되면
  곧바로 드러난다.

artifact: |
  <p class="entry-meta">
    발행일: <time datetime="{{DATE_PUBLISHED}}">{{DATE_PUBLISHED}}</time>
  </p>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "@id": "{{PAGE_URL}}#article",
    "mainEntityOfPage": { "@type": "WebPage", "@id": "{{PAGE_URL}}" },
    "headline": "{{HEADLINE}}",
    "datePublished": "{{DATE_PUBLISHED}}"
  }
  </script>

placeholders:
  - key: "{{DATE_PUBLISHED}}"
    meaning: "최초 발행일 (ISO 8601, 예: `2026-01-15`). **한 값이 화면과 마크업 두 자리를
      채운다** — 화면 표기를 `2026년 1월 15일` 처럼 현지화해도 되지만, 그때도
      `datetime` 속성은 ISO 값이어야 하고 둘이 같은 날짜여야 한다"
  - key: "{{PAGE_URL}}"
    meaning: "이 문서의 절대 URL. (적합성 러너는 픽스처 페이지 URL 로 자동 치환한다)"
  - key: "{{HEADLINE}}"
    meaning: "문서 제목. 화면 H1 과 같게 한다. 이미 P3-05 의 Article 을 발행하고 있다면
      이 블록을 새로 만들지 말고 거기에 datePublished 를 더하고, 화면의 `<time>` 만 붙여라"

verify:
  collector: FreshnessCollector
  expect_level: 2
  note: |
    골든 케이스 `remedy-p5-01-artifact-scores-two` 가 이 산출물을 **문서 페이지**
    `/blog/post` 의 `<body>` 에 놓고 돌린다 (홈에 놓으면 판정 대상이 아니다).
    화면의 `<p class="entry-meta">` 줄을 지우면 마크업만 남아 level 1 로 떨어진다 --
    그게 이 항목이 재는 것의 절반이라는 증거다.

    ⚠️ JSON-LD 의 `datePublished` 만 지우면 level 2 가 유지된다. `<time datetime>`
    속성 자체가 마크업 날짜로 세어지기 때문이다. 두 자리를 다 지워야 마크업이 사라진다.

fixture:
  # **문서 페이지에 놓는다. 홈이 아니다.** rubric 문구의 주어가 "콘텐츠에" 이고,
  # 회사 홈페이지에 발행일이 없는 것은 결함이 아니다. 2026-09-15 까지 이 픽스처는
  # `targets: ["/"]` 였고 -- 즉 우리가 발행한 처방이 "홈에 붙이시오" 라고 말하고
  # 있었다 -- 참조 구현이 홈을 문서로 취급하고 있어서 그대로 초록이었다.
  # P4-01(저자 표기)이 같은 이유로 진작 `/blog/*` 를 쓰고 있었다.
  place: body
  targets: ["/blog/post"]
  extra_urls: ["/blog/post"]

