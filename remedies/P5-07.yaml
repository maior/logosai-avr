# P5-07 내부 링크 건전성
#
# `process` 분류. P5-04(외부)와 기준이 다르다 — **내부 링크는 우리가 전부 통제하므로
# 기준이 더 엄하다**(3% 미만이 아니라 1% 미만).

item_id: P5-07

target_state: |
  확인에 성공한 내부 링크 중 broken(404·410·5xx) 비율이 **1% 미만**이고, 리다이렉트
  체인이 3홉을 넘는 링크가 0건이다.

  외부보다 엄한 이유는 통제권에 있다. 남의 사이트가 사라지는 것은 우리 잘못이 아니지만,
  우리 사이트 안에서 없는 페이지를 가리키는 것은 전적으로 우리 일이다.

  **왜 인용에 관계되는가**: 깨진 내부 링크는 크롤러의 탐색을 끊는다. 링크로만 닿을 수
  있는 문서가 있으면 그 문서는 색인되지 않는다.

steps:
  - "내부 링크를 전수 확인한다. 상대 경로와 앵커(`#`)를 제대로 풀어야 오탐이 안 난다."
  - "404 를 고친다. **대부분 이동한 페이지**이므로 새 주소로 링크를 갱신한다 —
    리다이렉트만 걸어 두면 링크는 여전히 옛 주소를 가리킨다."
  - "리다이렉트 체인이 3홉을 넘으면 최종 주소로 직접 건다. 사이트 개편을 여러 번 한
    사이트에서 흔하다."
  - "배포 파이프라인에 검사를 넣는다. 내부 링크는 **우리가 깨뜨리므로** 깨지는 순간을
    잡을 수 있고, 그게 사후에 찾는 것보다 훨씬 싸다."

verify:
  collector: FreshnessCollector
  demonstrates_level: 2
  note: |
    실측으로 양쪽 확인: 전부 200 → 2, 내부 링크 하나가 404 → 0. 그 위반은
    P5-04(외부 링크)를 건드리지 않는다.

fixture:
  serves: ["/", "/a"]
  extra_urls: ["/a"]
  # 내부 링크가 판정 대상이다. 없으면 분모가 없다.
  links: ["/a"]

adapters:
  - platform: any
    where: "CI 의 링크 검사. 정적 사이트 생성기는 대개 빌드 시 내부 링크 검사를 제공한다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다"
