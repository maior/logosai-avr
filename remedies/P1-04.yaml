# P1-04 /llms.txt 제공
#
# ⚠️ **이 항목의 근거 등급은 `unverified` 다** (정본: ../rubric/pillars.yaml).
#    등급은 여기 적지 않는다 — 로더가 rubric 에서 붙인다.
#
# 이 처방은 카탈로그에서 **효과를 주장할 수 없는 유일한 artifact** 다. 아래
# target_state 가 그 사실을 먼저 말한다. 순서가 중요하다: 붙여넣을 것을 먼저 주고
# 한계를 각주로 달면, 읽는 사람은 붙여넣고 끝낸다.

item_id: P1-04

target_state: |
  `/llms.txt` 가 200 으로 응답하고, H1 사이트명 + 요약 문단 + **링크 5개 이상**을
  담으며 각 링크에 한 줄 설명이 붙어 있다.

  **먼저 말해야 할 것: 주요 AI 가 이 파일을 실제로 읽는다는 실증이 약하다.**
  llms.txt 는 제안된 규약이고, 어느 AI 제공사도 "우리는 이 파일을 읽는다" 고 공시한
  바 없다. 우리도 읽힌 것을 관측한 적이 없다. 그래서 rubric 이 이 항목에
  `evidence_grade: unverified` 를 붙였고, 이 처방으로 **오르는 것은 ARS 뿐**이다.
  인용이 늘어난다고 읽으면 안 된다 — "rubric 점수가 오른다" 와 "인용이 늘어난다" 는
  다른 주장이다.

  그럼에도 등재하는 이유는 비용이 거의 0 이고(파일 한 장), 부작용이 없으며, 이미
  있는 페이지를 목록으로 정리하는 과정 자체가 2층(선택)에 필요한 "무엇이 우리의
  대표 문서인가" 를 강제로 답하게 만들기 때문이다. 그 답은 llms.txt 가 읽히든 말든
  쓸모가 있다.

  형식의 운영 정의: 링크가 있는 줄에서 링크를 지운 뒤 공백 아닌 글자가 1자 이상
  남으면 "한 줄 설명이 있다" 로 본다.

artifact: |
  # {{ORG_NAME}}

  {{ONE_LINE_SUMMARY}}

  ## 핵심 문서

  - [회사 소개]({{SITE_URL}}/about): {{ABOUT_DESC}}
  - [서비스 안내]({{SITE_URL}}/services): {{SERVICES_DESC}}
  - [요금]({{SITE_URL}}/pricing): {{PRICING_DESC}}
  - [도입 가이드]({{SITE_URL}}/guides): {{GUIDES_DESC}}
  - [자주 묻는 질문]({{SITE_URL}}/faq): {{FAQ_DESC}}
  - [문의]({{SITE_URL}}/contact): {{CONTACT_DESC}}

placeholders:
  - key: "{{ORG_NAME}}"
    meaning: "H1 에 오는 **브랜드가 불리는 이름**. 법인명이 아니라 검색·AI 답변에 등장하는 표기"
  - key: "{{ONE_LINE_SUMMARY}}"
    meaning: "요약 문단. '무엇을 하는 조직인가'에 한두 문장으로 답한다. 슬로건이 아니다.
      이 줄이 없으면 링크가 5개여도 level 1 이다"
  - key: "{{SITE_URL}}"
    meaning: "사이트 정본 URL (끝 슬래시 없이). 링크는 절대 URL 로 적는다"
  - key: "{{ABOUT_DESC}}"
    meaning: "회사 소개 페이지에 **무엇이 있는지** 한 줄. '회사 소개입니다' 는 설명이
      아니다 — '설립 연도·대표자·주요 연혁' 처럼 내용을 적는다"
  - key: "{{SERVICES_DESC}}"
    meaning: "서비스 페이지의 내용 한 줄. 제공 품목과 대상 고객"
  - key: "{{PRICING_DESC}}"
    meaning: "요금 페이지의 내용 한 줄. 과금 단위(사용자당/건당/월정액)를 밝히면 좋다"
  - key: "{{GUIDES_DESC}}"
    meaning: "가이드 문서의 내용 한 줄. 어떤 문제를 다루는 문서 모음인가"
  - key: "{{FAQ_DESC}}"
    meaning: "FAQ 의 내용 한 줄. 어떤 종류의 질문에 답하는가"
  - key: "{{CONTACT_DESC}}"
    meaning: "문의 경로 한 줄. 응답 채널과 대략적 응답 시간"

verify:
  collector: LlmsTxtCollector
  expect_level: 2
  note: |
    골든 케이스 `remedy-p1-04-artifact-scores-two` 가 이 파일을 읽어 `/llms.txt`
    파일로 놓고 돌린다. 링크가 5개 미만이 되거나 설명이 하나라도 빠지면 빨개진다.

    ⚠️ 이 케이스가 초록이라는 것은 **형식이 rubric 을 만족한다**는 뜻이지, 이 파일이
    AI 에 읽힌다는 뜻이 아니다. 그 주장을 하려면 프로빙(Plane A) 전후 비교가 필요하고
    우리는 아직 하지 않았다.

fixture:
  place: file
  targets: ["/llms.txt"]

adapters:
  - platform: nextjs
    where: "public/llms.txt (정적) 또는 app/llms.txt/route.ts 로 text/plain 응답"
    status: unconfirmed
    note: "확인 안 함. 정적 파일이면 빌드 때 고정되므로 문서를 추가해도 목록이 안 늘어난다 —
      낡은 목록은 없는 것보다 나쁠 수 있는데 그 판단의 근거도 우리에겐 없다"
  - platform: wordpress
    where: "루트에 정적 llms.txt 업로드, 또는 템플릿 rewrite 로 /llms.txt 라우팅"
    status: unconfirmed
    note: "확인 안 함. 워드프레스는 확장자 없는 경로를 퍼머링크로 가로채므로 정적 파일이
      그대로 서빙되는지는 서버 설정(.htaccess/nginx)에 달렸다"
  - platform: cafe24
    where: "관리자 > 디자인 > 파일 업로드 (루트 경로 접근 가능 여부 확인 필요)"
    status: unconfirmed
    note: "확인 안 함. 호스팅형 빌더가 루트에 임의 파일을 놓게 해주는지 자체가 불확실하다"
