# P2-01 답변 우선 구조 (answer-first)
#
# **이 처방은 우리가 효과를 확인하지 못한 조언이다.** 담당 수집기가 없고, 아래
# `not_verifiable` 이 밝히듯 **만들지 않기로** 한 쪽이다 -- 못 만든 것과 다르다.

item_id: P2-01

target_state: |
  핵심 랜딩의 70% 이상에서 **H1 직후 첫 문장이 곧 결론**이고, 그 문장만 떼어도
  질문에 답이 된다.

  뒤집어 말하면 첫 문단에서 빼야 하는 것들이 있다 — 인사말("안녕하세요"),
  회사 연혁("2009년 설립 이래"), 수식어("최고의", "혁신적인"). 결론이 본문
  3문단 뒤에 나오면 rubric 은 0 으로 본다.

  자가 점검은 한 문장으로 된다. **첫 문장만 잘라내 따로 읽었을 때 그 페이지가
  답하려는 질문에 답이 되는가.** 안 되면 아직 answer-first 가 아니다.

example: |
  <!-- 나쁜 예 (결론이 뒤에 있다)
       <h1>재고관리 시스템</h1>
       <p>안녕하세요. 저희는 2009년 설립 이래 물류 현장과 함께해 왔습니다.
          고객의 성공이 곧 저희의 성공이라는 믿음으로...</p>
  -->
  <h1>재고관리 시스템 도입 비용은 얼마인가</h1>
  <p>사용자 10명 기준 월 9만 원이고, 초기 구축비는 따로 없다. 사용자 수에 비례해
     늘어나며 연 단위로 계약하면 두 달치가 빠진다.</p>
  <h2>무엇이 비용에 포함되는가</h2>
  <p>구독료에 데이터 이관과 초기 교육 2회가 포함된다. 창고가 세 곳을 넘으면
     현장 방문 교육이 건당 30만 원으로 별도다.</p>

# 담당 수집기가 없다. **없는 이유가 P1-08 과 다르다** -- 저쪽은 비용이 막고
# 이쪽은 우리가 안 하기로 했다. 그 차이가 로드맵을 가른다.
not_verifiable: |
  담당 수집기를 **만들지 않기로 했다.** "첫 문장이 결론인가" 는 표기나 배치가
  아니라 **의미 판단**이다. 규칙으로 흉내내면 — 예컨대 "안녕하세요로 시작하면
  0점" 같은 문자열 규칙 — 인사말을 지운 홍보 문구는 그대로 통과하고, 결론을
  담담하게 쓴 좋은 첫 문장은 걸릴 근거가 없다. 그러면 이 항목은 아무것도 재지
  않으면서 **오답을 확신에 차서 내는** 상태가 된다. 같은 P2 안에서도 P2-04(섹션
  첫 문장이 지시어로 시작하는가)와 P2-09(요약 블록이 본문 앞에 몇 개 있는가)는
  형태와 위치를 묻기에 수집기를 뒀다 — 되는 것만 한다는 기준이 이 항목을 밖에
  둔다. 크롤 예산이 늘어나면 풀리는 P1-08 과 달리, 이쪽은 비용이 아니라 **판정
  가능성**이 막는다.

