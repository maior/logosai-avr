# P2-08 정의문 존재
#
# **이 처방은 붙여넣는 것이 아니다.** 아래 `example` 은 채워진 예시이고, 당신의
# 정의문은 당신이 써야 한다. 우리가 확인할 수 있는 것은 하나뿐이다 -- 이 **틀이
# 2점에 닿을 수 있다**. 당신 글이 2점이 된다는 뜻이 아니다.

item_id: P2-08

target_state: |
  브랜드(또는 핵심 서비스)를 설명하는 **한 문장 정의문(30어절 이내)** 이 홈·About·
  주요 랜딩에서 **똑같이** 반복되고, 페이지 간 일치율이 60% 이상이다.

  형태가 판정된다 — 주제어에 '은/는'이 붙고 서술어가 '~다' 로 끝나는 단문이다.

      [주제어]는 [무엇]을 [어떻게] 하는 [범주]다.

  **핵심은 '똑같이' 다.** 페이지마다 조금씩 고쳐 쓰면 이 항목은 0 에 가까워진다.
  한 번 정하고 복사해 쓴다 — 홈에서는 "창고 관리를 쉽게", About 에서는 "물류
  혁신의 파트너" 라고 쓰는 사이트가 대부분이고, 그러면 무엇을 하는 회사인지
  어디에도 적혀 있지 않은 셈이 된다.

  피할 것: 수식어("최고의", "혁신적인"), 슬로건, 두 문장으로 나누기. 30어절을
  넘으면 정의가 아니라 소개문이다.

example: |
  <h1>재고관리 시스템 소개</h1>
  <p>재고관리 시스템은 창고의 품목 수량과 위치를 한곳에 기록해 장부와 실물을 맞추는 소프트웨어다.</p>
  <h2>어디에 쓰는가</h2>
  <p>입고와 출고를 한 화면에서 기록한다. 실사 때 장부와 대조할 표를 그대로 뽑아 쓴다.</p>

not_verifiable: null

verify:
  collector: StructureCollector
  demonstrates_level: 2
  note: |
    골든 케이스 `remedy-p2-08-example-demonstrates-two` 가 **이 파일을 직접 읽어**
    돌린다. 정의문에서 '~다' 종결이나 '은/는' 주제격을 빼면 정의문으로 세지 않아
    그 케이스가 빨개진다.

    이 항목은 **페이지 간 일치율**이 본체라 한 장으로는 판정이 성립하지 않는다
    (한 장이면 `input_missing`). 그래서 픽스처가 같은 예시를 홈과 `/about` 두 곳에
    놓는다 -- 그 둘이 같아야 일치율 100% 가 나온다는 것이 이 처방의 주장이다.

fixture:
  # 두 장이 필요하다. `extra_urls` 가 일치율의 분모이고, `targets` 가 같은 정의문을
  # 두 곳에 놓는다 -- 한 곳만 놓으면 분모가 1 이라 "페이지마다 같은가" 를 물을 수 없다.
  place: document
  targets: ["/", "/about"]
  extra_urls: ["/about"]

adapters:
  - platform: any
    where: "홈·About·주요 랜딩의 첫 문단. 이것은 마크업이 아니라 **같은 문장을
      여러 곳에 두는 일**이다 — CMS 라면 재사용 블록으로 두면 갈라지지 않는다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다. 틀이 2점에 닿는다는 것만 골든
      케이스로 확인했다"
