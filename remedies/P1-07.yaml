# P1-07 상태코드 건전성
#
# `infra` 분류다 — **붙여넣을 코드가 없다.** 서버·CDN 설정과 링크 정리를 하는 일이고,
# 그래서 산출물 자리에 절차가 들어간다.

item_id: P1-07

target_state: |
  대표 URL 집합에서 4xx/5xx 비율이 2% 미만이고 **5xx 는 0건**이며, soft 404 가 없다.

  soft 404 = 없는 페이지인데 **200 을 주면서** 본문에 "페이지를 찾을 수 없습니다" 를
  적는 것. 사람 눈에는 오류 페이지지만 기계에는 정상 문서라, AI 크롤러가 그 빈 껍데기를
  색인하고 사이트의 실제 콘텐츠 비율을 떨어뜨린다. **없는 페이지는 404 를 주어야 한다.**

  5xx 를 0건으로 못박는 이유는 4xx 와 뜻이 다르기 때문이다. 404 는 "그 문서가 없다"
  이지만 503 은 "지금 이 서버를 믿을 수 없다" 이고, 크롤러는 후자를 보면 사이트 전체의
  크롤 빈도를 낮춘다.

steps:
  - "대표 URL 집합(sitemap 또는 내부 링크 상위 경로)에 대해 상태코드를 전수 확인한다.
    브라우저가 아니라 curl 로 봐야 한다 — 브라우저는 리다이렉트를 따라가 최종 200 만 보인다."
  - "5xx 를 먼저 0 으로 만든다. 간헐적 5xx 는 부하가 아니라 배포 중 무중단 설정 누락인
    경우가 많다(구 프로세스 종료와 신 프로세스 기동 사이 공백)."
  - "없는 페이지가 200 을 주고 있지 않은지 본다. SPA 라우터와 CMS 기본 템플릿이 흔한
    원인이다 — 라우트 미매치 시 404 상태코드를 실제로 반환하게 고친다."
  - "죽은 내부 링크를 지우거나 고친다. 리다이렉트로 덮으면 상태코드는 좋아지지만
    링크 자체는 여전히 틀린 곳을 가리킨다."
  - "고친 뒤 재진단해 4xx/5xx 비율과 soft 404 건수가 0 에 수렴하는지 확인한다."

verify:
  collector: ReachabilityCollector
  demonstrates_level: 2
  note: |
    **여기서 "예시" 는 마크업 블록이 아니라 그 응답 상태를 가진 사이트다.** 그래서
    보여줄 코드 상자가 없고, 픽스처가 대표 URL 셋을 전부 200 으로 응답하게 해서 잰다.

    목표 상태가 **실제로 그 점수를 만드는가**는 양쪽으로 확인했다(실측):
    전부 200 → 2, soft 404 하나 → 1, 5xx 하나 → 0.
    infra 의 위험은 틀린 조언이다 — 붙여넣을 것이 없으니 고객은 우리 문장만 보고
    서버를 고치는데, 그 문장이 틀렸으면 고치고도 점수가 안 오른다.

fixture:
  serves: ["/", "/a", "/b"]
  extra_urls: ["/a", "/b"]

adapters:
  - platform: nginx
    where: "`error_page` 지시어와 업스트림 상태 전달 설정. SPA 는 `try_files` 의
      마지막 폴백이 `/index.html` 이면 없는 경로가 전부 200 이 된다 — `=404` 로 끝낸다"
    status: unconfirmed
    note: "어느 서버에도 적용해 재진단한 적 없다"
  - platform: nextjs
    where: "`not-found.tsx` 는 **자동으로 404 상태코드를 반환한다.** 다만 동적 경로에서
      데이터가 없을 때 직접 `notFound()` 를 호출하지 않으면 200 이 나간다"
    status: unconfirmed
    note: "확인 안 함"
  - platform: cafe24
    where: "관리자의 오류 페이지 설정"
    status: unconfirmed
    note: "확인 안 함. 호스팅형 빌더는 상태코드를 바꿀 수 없는 경우가 있다"
