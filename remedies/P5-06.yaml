# P5-06 콘텐츠 리뷰 운영 체계
#
# `process` 분류이자 **검증 수단이 없는** 처방이다. 아래 `not_verifiable` 이 이유를 밝힌다.

item_id: P5-06

target_state: |
  콘텐츠 유형별 **리뷰 주기와 담당자**가 문서로 정의돼 있고, 최근 1개 주기 안에 실제
  리뷰를 수행한 기록이 있다.

  이 항목은 P5-03(갱신 주기)의 **원인**을 본다. 갱신률이 높아도 우연이면 다음 분기에
  무너진다. 체계가 있으면 숫자가 유지된다.

steps:
  - >-
    콘텐츠를 유형별로 나눈다 — 가격·정책처럼 자주 바뀌는 것과 개념 설명처럼 오래 가는 것은 주기가 달라야 한다.
  - >-
    유형별 주기와 담당자를 문서에 적는다. **담당자가 없는 주기는 지켜지지 않는다.**
  - >-
    리뷰 수행 기록을 남긴다. 이슈 트래커든 스프레드시트든, 다음 사람이 "지난 분기에 봤는가" 를 확인할 수 있으면 된다.
  - >-
    이 문서를 P5-03(갱신 주기)·P5-04(외부 링크 점검) 주기와 한 곳에 모은다 — 세 항목이 같은 운영 리듬 위에 있다.

not_verifiable: |
  담당 수집기가 없고 **만들 수 없다.** 판정 대상이 사이트가 아니라 **조직의 내부
  문서와 수행 기록**이다. 크롤로는 존재 자체를 알 수 없고, 공개돼 있다 해도 "실제로
  수행했는가" 는 기록의 진위 문제라 기계가 답할 수 없다.

  rubric 이 이 항목을 `check: manual` 로 둔 이유가 그것이고, 심화 진단에서 사람이
  고객 인터뷰나 문서 제출로 판정한다.

adapters:
  - platform: any
    where: "내부 운영 문서. 사이트에 올릴 필요도 없다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없고, 우리 수집기로는 확인할 방법도 없다"
