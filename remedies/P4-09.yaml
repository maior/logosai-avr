# P4-09 네이버 생태계 신뢰 신호
#
# `process` 분류이자 **검증 수단이 없는** 처방이다. 아래 `not_verifiable` 이 이유를 밝힌다.

item_id: P4-09

target_state: |
  자사 네이버 채널(블로그·포스트·플레이스 등)이 최근 3개월 내 갱신되고, 카페·지식iN·
  뉴스 중 **2개 이상 유형**에서 제3자 언급이 확인된다.

steps:
  - >-
    자사 네이버 채널의 최종 갱신일을 확인하고 3개월 주기를 정한다.
  - >-
    제3자 언급은 **만드는 것이 아니라 얻는 것**이다. 카페·지식iN 에 자작 글을 올리는 것은 이 항목이 재려는 것과 정반대이고, 발각되면 채널 자체가 제재된다.
  - >-
    언급이 생길 조건을 만든다 — 실제로 인용할 만한 데이터·가이드를 발행하는 쪽이 유일하게 지속 가능한 길이다. 이건 P4-07(원본 데이터)과 같은 일이다.

not_verifiable: |
  담당 수집기가 없고 **만들지 않는다.** 카페·지식iN·뉴스에서 언급을 세려면 네이버
  검색을 자동으로 긁어야 하는데, 약관이 금지하고 우리 크롤 규칙과도 맞지 않는다.

  그리고 이 항목은 절반이 얻는 것이다 — 자사 채널 갱신은 할 수 있지만 제3자 언급은
  우리도 고객도 직접 만들 수 없다. 만들려 하면 그것이 곧 조작이다.

adapters:
  - platform: any
    where: "네이버 채널 운영. 코드가 아니다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없고, 우리 수집기로는 확인할 방법도 없다"
