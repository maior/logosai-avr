# P1-01 AI 크롤러 접근 허용 (blocking)
#
# **이 항목은 blocking 이다.** 0 점이면 총점이 40 으로 잘린다. 그래서 이 처방은
# 카탈로그에서 가장 값이 크면서 동시에 **가장 덜 중요하다** -- AVR 3층 모델의 1층이고,
# "메타태그 층, 하루면 끝난다, 필요조건이지 충분조건이 아니다" 에 해당한다.
# 이걸 고쳐도 AVI 는 안 움직일 수 있다. 게이팅이 풀릴 뿐이다.
#
# 산출물은 우리가 발명한 것이 아니라 RFC 9309(robots.txt) 문법이다.

item_id: P1-01

target_state: |
  `/robots.txt` 가 200 으로 응답하고, 그 안에서

    ① 답변 인용에 쓰이는 **검색봇 3종**(OAI-SearchBot · Claude-SearchBot ·
       PerplexityBot)이 대상 경로에 대해 Allow 이고,
    ② **학습봇 3종**(GPTBot · ClaudeBot · Google-Extended)의 허용/차단이
       **의도적으로 분리 설정**되어 있다.

  ②가 이 항목의 핵심이다. rubric 은 학습봇을 "허용하라" 고 말하지 않는다 --
  **결정했음을 파일에 남기라**고 말한다. 학습 거부는 정당한 사업 결정이고, 답변
  인용(검색봇)과 모델 학습(학습봇)은 서로 다른 선택지다. 둘을 구분하지 않은 채
  `User-agent: *` 하나에 맡긴 상태가 level 1 이다.

  `User-agent: *` + `Disallow: /` 는 level 0 이지만, 그 아래에서 AI 봇을 개별
  허용했다면 상위 등급이 먼저 평가된다(spec plane-b §2.1-2). 전면 차단 한 줄만 보고
  0 점을 주면 AI 친화적으로 설정한 사이트가 게이팅에 걸린다.

artifact: |
  User-agent: *
  Allow: /
  Disallow: /admin/

  # ── 답변 인용에 쓰이는 검색봇: 허용한다 ──
  # 이 셋을 막으면 AI 답변에 인용될 경로 자체가 없어진다.
  User-agent: OAI-SearchBot
  Allow: /

  User-agent: Claude-SearchBot
  Allow: /

  User-agent: PerplexityBot
  Allow: /

  # ── 모델 학습용 봇: 허용/차단을 **따로** 정한다 ──
  # 무엇을 고르든 level 2 다. 고르지 않은 것(= 이 블록이 없는 것)이 level 1 이다.
  User-agent: GPTBot
  {{GPTBOT_RULE}}

  User-agent: ClaudeBot
  {{CLAUDEBOT_RULE}}

  User-agent: Google-Extended
  {{GOOGLE_EXTENDED_RULE}}

  Sitemap: {{SITE_URL}}/sitemap.xml

placeholders:
  - key: "{{GPTBOT_RULE}}"
    meaning: "OpenAI 학습 크롤러에 대한 결정을 한 줄로. `Allow: /` 또는 `Disallow: /`.
      둘 다 level 2 다 — rubric 이 요구하는 것은 허용이 아니라 **결정을 남기는 것**이다"
  - key: "{{CLAUDEBOT_RULE}}"
    meaning: "Anthropic 학습 크롤러에 대한 결정. `Allow: /` 또는 `Disallow: /`.
      검색봇(Claude-SearchBot)과 다른 봇이며, 이걸 막아도 답변 인용은 막히지 않는다"
  - key: "{{GOOGLE_EXTENDED_RULE}}"
    meaning: "Gemini 학습에 대한 결정. `Allow: /` 또는 `Disallow: /`.
      일반 Googlebot 과 별개라 이걸 막아도 구글 검색 색인에는 영향이 없다"
  - key: "{{SITE_URL}}"
    meaning: "사이트 정본 URL (끝 슬래시 없이). Sitemap 지시자는 **절대 URL** 이어야
      하며, 이 한 줄이 없으면 sitemap 이 멀쩡해도 P1-05 가 0 점이다"

verify:
  collector: RobotsCollector
  expect_level: 2
  note: |
    골든 케이스 `remedy-p1-01-artifact-scores-two` 가 이 파일을 직접 읽어 치환한 뒤
    `/robots.txt` **파일로** 놓고 수집기에 돌린다. HTML `<head>` 에 넣으면 수집기는
    영원히 404 를 본다 -- 그래서 fixture 가 자리를 `file` 로 선언한다.

fixture:
  place: file
  targets: ["/robots.txt"]

