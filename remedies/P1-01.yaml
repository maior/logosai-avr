      그 경우 플러그인 설정이 정적 파일보다 우선하는지 버전에 따라 다르다"
  - platform: cafe24
    where: "관리자 > 상점관리 > 검색엔진 최적화(SEO) > robots.txt 설정"
    status: unconfirmed
    note: "확인 안 함. 호스팅형 빌더라 임의 User-agent 블록을 넣을 수 있는지, 편집이
      요금제에 걸리는지 확인하지 못했다"
