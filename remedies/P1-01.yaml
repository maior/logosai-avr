  # 를 확인했는가.** 아직 아무 플랫폼도 확인하지 않았으므로 전부 unconfirmed 다.
  - platform: nextjs
    where: "app/robots.ts (Metadata API) 또는 public/robots.txt"
    status: unconfirmed
    note: "확인 안 함. app/robots.ts 의 타입은 userAgent 별 rules 배열을 요구해 위 문법과
      모양이 다르다 — 옮겨 적을 때 학습봇 블록이 통째로 누락되기 쉽다"
  - platform: wordpress
    where: "루트에 정적 robots.txt 를 두거나, SEO 플러그인의 robots.txt 편집기"
    status: unconfirmed
