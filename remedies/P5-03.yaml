# P5-03 갱신 주기
#
# `process` 분류. 이건 **한 번 하는 일이 아니라 계속 하는 일**이고, 그래서 처방이
# 작업 목록이 아니라 운영 리듬이다.

item_id: P5-03

target_state: |
  최근 6개월 내 갱신된 콘텐츠가 전체의 **40% 이상**이고, 핵심 랜딩은 최근 3개월 내
  갱신돼 있다.

  판정은 sitemap 의 `lastmod` 로 한다. 그래서 **`lastmod` 를 실제 변경 시점에 맞게
  갱신하는 것 자체가 이 항목의 절반**이다 — 빌드마다 전부 오늘 날짜로 찍는 사이트는
  숫자상 만점이지만 그 수치는 거짓이고, P5-02(최종수정일)가 그걸 따로 잡는다.

  **왜 인용에 관계되는가**: AI 답변 엔진은 "지금도 맞는 정보인가" 를 판단할 근거가
  날짜밖에 없다. 오래된 문서는 사실이 맞아도 뒤로 밀린다.

steps:
  - "sitemap 의 `lastmod` 분포를 본다. 전부 같은 날짜면 자동 생성이라 신호가 아니다."
  - "핵심 랜딩(제품·서비스·가격·FAQ)을 먼저 본다. 이쪽은 3개월 기준이라 더 자주 봐야
    하고, 실제로 바뀌는 정보(가격·기능)가 담겨 있어 손볼 거리도 있다."
  - "**날짜만 고치지 않는다.** 내용이 안 바뀌었는데 lastmod 만 올리면 그건 조작이고,
    P5-02 가 '본문 변경 없이 갱신되는 날짜' 로 잡아낸다."
  - "갱신 주기를 콘텐츠 유형별로 정해 문서화한다 — 그 문서가 P5-06(리뷰 체계)의
    판정 대상이기도 하다. 두 항목을 한 번에 처리하는 지점이다."

verify:
  collector: ContentCadenceCollector
  demonstrates_level: 2
  note: |
    실측으로 양쪽 확인: sitemap 의 lastmod 가 최근이면 2, 전부 2년 전이면 0.
    그 위반은 P5-04·P5-07(링크)을 건드리지 않는다.

fixture:
  serves: ["/", "/p0", "/p1", "/p2", "/p3", "/p4", "/p5"]
  extra_urls: ["/p0", "/p1", "/p2", "/p3", "/p4", "/p5"]
  # 판정 근거가 sitemap 의 lastmod 다. 20일 전이면 6개월·3개월 두 기준을 모두 넘는다.
  sitemap_lastmod_days: 20

adapters:
  - platform: any
    where: "sitemap 생성기의 lastmod 설정. 대부분 '파일 수정 시각' 을 쓰는데, 그게
      빌드 시각이면 전부 같은 날짜가 된다 — **콘텐츠의 변경 시각**을 쓰게 바꾼다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다"
