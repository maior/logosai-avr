# P2-06 단락 길이
#
# **이 처방은 붙여넣는 것이 아니다.** 아래 `example` 은 채워진 예시이고, 당신의
# 글은 당신이 써야 한다. 우리가 확인할 수 있는 것은 하나뿐이다 -- 이 **틀이 2점에
# 닿을 수 있다**. 당신 글이 2점이 된다는 뜻이 아니다.

item_id: P2-06

target_state: |
  **산문 단락**(2문장 이상)의 **70% 이상이 2~4문장**이고, **6문장을 넘는 단락이 10%
  미만**이다. 산문 단락이 홈과 표본 페이지를 통틀어 **5개 이상** 있어야 판정된다.

  한 단락에 한 가지만 담는다는 원칙이 그대로 수치가 된 항목이다. 여섯 문장을
  넘어가는 단락은 대개 두세 가지를 담고 있고, 조각으로 잘려 색인될 때 그 조각이
  무엇에 대한 것인지 흐려진다.

  한 문장짜리 단락은 **세지 않는다** (rubric v1.10.0). 메뉴·가격·버튼 문구가 그렇고,
  그것들을 단락으로 세면 잘 쓴 본문이 있어도 비율이 가려진다 -- v1.9.0 까지 모든
  사이트가 그 때문에 1점이었다. 그러니 `<p>` 를 문장마다 끊어 써도 감점은 아니지만,
  **산문 단락이 사라져 판정 자체가 안 된다.** 이 항목은 "읽히는 본문이 있는가" 를
  전제로 그 본문의 단락 길이를 본다.

  긴 단락을 나눌 때는 문장 수로 세지 말고 **화제가 바뀌는 지점**에서 끊는다.
  화제가 하나인데 길다면 단락이 아니라 문장이 긴 것이고, 그건 P2-05 가 잡는다.

example: |
  <h1>재고 부족 알림 설정</h1>
  <p>알림 기준은 품목마다 다르게 잡는다. 회전이 빠른 품목은 넉넉히 잡아야 한다. 회전이 느린 품목은 재고가 오래 남으므로 낮게 잡는다.</p>
  <h2>기준 수량 정하기</h2>
  <p>기준 수량은 하루 평균 출고량에 리드타임을 곱해 구한다. 리드타임은 발주일부터 입고일까지의 날 수다. 계절을 타는 품목은 지난해 같은 달 값을 쓴다.</p>
  <h2>알림 받을 사람 정하기</h2>
  <p>알림은 발주 권한이 있는 사람에게만 보낸다. 권한이 없는 사람에게 보내면 알림이 무시된다. 무시되기 시작하면 알림 자체가 무의미해진다.</p>
  <h2>점검 주기</h2>
  <p>기준 수량은 분기마다 다시 본다. 출고량이 30% 이상 달라진 품목만 고치면 된다. 전부 고치려 들면 아무도 하지 않는다.</p>
  <h2>알림이 울린 뒤</h2>
  <p>알림을 받으면 발주 전에 입고 예정 수량부터 확인한다. 이미 발주가 나간 품목이면 알림을 닫는다.</p>

not_verifiable: null

verify:
  collector: StructureCollector
  demonstrates_level: 2
  note: |
    골든 케이스 `remedy-p2-06-example-demonstrates-two` 가 **이 파일을 직접 읽어**
    돌린다. 단락을 합쳐 6문장을 넘기면 그 케이스가 빨개진다.

    **다섯 번째 단락은 v1.10.0 에서 더했다.** 산문 단락 하한이 5 가 되면서 네
    단락짜리 예시는 판정 불가가 됐고, 이 골든 케이스가 그것을 잡았다 -- 처방
    예시도 rubric 과 같은 자로 재야 한다는 뜻이다.

    한 줄짜리 `<li>` 는 이제 비율을 깎지 않는다(한 문장짜리라 분모에서 빠진다).
    표와 리스트는 P2-07 이 따로 본다.

