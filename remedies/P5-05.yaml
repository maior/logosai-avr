# P5-05 변경 이력 기록
#
# `process` 분류이자 **검증 수단이 없는** 처방이다. 아래 `not_verifiable` 이 이유를 밝힌다.

item_id: P5-05

target_state: |
  핵심 문서에 **날짜 + 변경 내용 요약**을 담은 변경 이력 블록이 있거나, 제품 changelog
  페이지가 운영된다.

  날짜만 있는 것은 이력이 아니다. "2026-03-01 수정" 은 무엇이 바뀌었는지 말하지 않아,
  읽는 쪽이 이전 판단을 갱신할 근거가 되지 않는다.

steps:
  - >-
    핵심 문서를 고를 때 "이 문서가 바뀌면 독자의 결정이 바뀌는가" 를 기준으로 한다.
  - >-
    변경 이력 형식을 정한다 — 날짜 · 무엇이 바뀌었나 · (필요하면) 왜.
  - >-
    고칠 때마다 적는 규칙을 만든다. 나중에 몰아서 쓰면 정확하지 않고, 정확하지 않은 이력은 없느니만 못하다.

not_verifiable: |
  담당 수집기가 없다. "변경 내용 요약" 이 있는지 판정하려면 그 문단이 **실제로 변경을
  서술하는가**를 읽어야 하고, 그건 의미 판단이다.

  날짜 목록의 존재만으로 2점을 주면 "2026-03-01 수정" 만 나열한 사이트가 통과한다 —
  이 항목이 막으려는 바로 그 상태다. P2-01(answer-first)을 안 하는 것과 같은 이유로,
  규칙으로 흉내내면 오답을 확신에 차서 낸다.

adapters:
  - platform: any
    where: "문서 템플릿과 편집 규칙. 코드가 아니라 습관이다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없고, 우리 수집기로는 확인할 방법도 없다"
