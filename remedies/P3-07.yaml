# P3-07 sameAs 엔티티 링크
#
# `fact` 분류의 가장 순수한 예다. 마크업은 한 줄이지만, **그 줄에 넣을 것이 없으면
# 아무것도 못 한다.** 위키데이터 항목이 없는 회사는 sameAs 를 쓸 수 없고, 그건
# 마크업 문제가 아니라 세상에 그 사실이 아직 없다는 문제다.

item_id: P3-07

target_state: |
  Organization 노드의 `sameAs` 에 **총 4개 이상**의 프로필 링크가 있고, 그중
  지식베이스(위키데이터·위키백과) 1개 이상과 기업 데이터베이스(링크드인·크런치베이스·
  잡플래닛·더브이씨 등) 1개 이상이 포함되며, 전 링크가 200 으로 응답한다.

  **왜 이게 인용에 관계되는가**: sameAs 는 "이 사이트의 조직은 저기 있는 그 조직과
  같다" 는 선언이다. AI 답변 엔진이 브랜드를 지식 그래프의 한 마디와 이어 붙일 수
  있게 하는 유일한 기계 판독 수단이고, 이어 붙지 않은 브랜드는 이름이 겹치는 다른
  회사와 구별되지 않는다.

prerequisites:
  - what: "지식베이스 항목 (위키데이터 또는 위키백과)"
    why: "**대부분의 중소기업에 아직 없다.** 없는 주소를 sameAs 에 적으면 그건 마크업이
      아니라 거짓말이고, 링크가 404 면 이 항목은 오히려 1점으로 깎인다. 위키데이터는
      직접 항목을 만들 수 있지만 저명성 기준이 있어 거부될 수 있다"
  - what: "기업 데이터베이스 프로필 (링크드인·크런치베이스·잡플래닛 등)"
    why: "링크드인 회사 페이지는 만들 수 있고 국내는 잡플래닛·더브이씨가 대안이다.
      **개인 계정이 아니라 회사 페이지**여야 조직 엔티티를 가리킨다"
  - what: "그 프로필들이 실제로 이 조직을 가리킨다는 사실"
    why: "이름이 비슷한 다른 회사의 프로필을 걸면 우리는 그것을 기계로 구별하지 못하고,
      AI 답변 엔진은 두 회사를 합쳐 버린다. 아래 천장이 바로 이 지점이다"

# **완전한 블록으로 준다.** `"sameAs": [...]` 조각만 주면 그대로는 유효한 JSON-LD 가
# 아니고, 고객이 어디에 끼울지 스스로 판단해야 한다. 이미 P3-01 을 적용한 사이트는
# 아래 `sameAs` 키만 **기존 노드에 옮겨 담는다** — 조직 노드를 둘로 만들지 않는다.
artifact: |
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "{{SITE_URL}}#organization",
    "name": "{{ORG_NAME}}",
    "url": "{{SITE_URL}}",
    "sameAs": [
      "{{KNOWLEDGE_BASE_URL}}",
      "{{BUSINESS_DB_URL}}",
      "{{PROFILE_URL_3}}",
      "{{PROFILE_URL_4}}"
    ]
  }
  </script>

placeholders:
  - key: "{{SITE_URL}}"
    meaning: "사이트 정본 URL. P3-01 과 **같은 @id** 가 되게 맞춘다 — 다르면 조직 노드가
      둘로 갈린다"
  - key: "{{ORG_NAME}}"
    meaning: "P3-01 과 같은 이름"
  - key: "{{KNOWLEDGE_BASE_URL}}"
    meaning: "위키데이터 항목 또는 위키백과 문서 주소. 없으면 이 처방은 아직 쓸 수 없다"
  - key: "{{BUSINESS_DB_URL}}"
    meaning: "링크드인 **회사** 페이지 또는 크런치베이스·잡플래닛·더브이씨 프로필"
  - key: "{{PROFILE_URL_3}}"
    meaning: "총 4개를 채우기 위한 세 번째. 공식 SNS·채용 페이지 등 조직을 가리키는 것만"
  - key: "{{PROFILE_URL_4}}"
    meaning: "네 번째. 억지로 채우지 말고 **실제로 그 조직인 것**만 넣는다 — 404 나
      남의 프로필은 점수를 깎는다"

verify:
  collector: SchemaOrgCollector
  expect_unavailable_kind: inconclusive
  ceiling: |
    **완전한 sameAs 를 붙여도 자동 판정은 2 에 닿지 않는다.** rubric levels."2" 의
    마지막 절이 "해당 프로필이 **실제 동일 엔티티를 가리킴**" 인데, 그건 링크 저편의
    내용을 사람이 읽고 판단할 일이다. 우리 수집기는 링크 개수·종류·응답만 확인하고
    거기서 멈춘다 — 실측으로 확인했다: 지식베이스 2 + 기업DB 2, 전부 200 인 픽스처가
    `inconclusive` 를 낸다(사유: "사람 판단이 필요해 자동 판정 불가").

    2 를 주려면 우리가 확인하지 않은 것을 확인한 척해야 한다. 그건 이 제품이 하지
    말아야 할 일이라, 어디서 멈추는지를 적고 그 지점을 시험한다.

fixture:
  place: head
  targets: ["/"]
  # sameAs 링크가 **200 으로 응답해야** 천장이 제 이유로 잡힌다. 응답을 못 받으면
  # 수집기는 "전 링크 200 조건을 판정할 수 없음" 으로 멈추는데, 그것도 inconclusive 라
  # kind 만 보면 케이스가 초록이면서 **엉뚱한 것을 재게 된다.**
  serves:
    - "https://www.wikidata.org/wiki/Q1"
    - "https://www.linkedin.com/company/example"
    - "https://ko.wikipedia.org/wiki/example"
    - "https://www.crunchbase.com/organization/example"

adapters:
  - platform: any
    where: "P3-01 의 Organization JSON-LD 안. **별도 블록으로 만들지 말고** 기존
      Organization 노드에 `sameAs` 키를 더한다 — 조직 노드가 둘이 되면 어느 쪽이
      정본인지 기계가 모른다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다"
