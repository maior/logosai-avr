# 처방 카탈로그가 각 항목에 대해 **무엇을 줄 수 있는가**의 정본.
#
# 왜 필요한가: rubric 의 `levels` 는 "level 2 는 이렇게 판정된다" 를 말하지 "이렇게
# 하세요" 를 말하지 않는다. 판정 기준과 조치는 다르다. 카탈로그가 그 간극을 메우는데,
# 메우는 순간 **모든 항목이 붙여넣기로 해결되는 것처럼 보이는** 거짓말이 가능해진다.
#
# 45항목 중 전문을 줄 수 있는 것은 12개뿐이다. 이 파일은 나머지 33개가 왜 아닌지를
# 종류별로 못박는다.
#
# ⚠️ 이것은 표준이 아니다. AVR 은 측정 모델이고(`STANDARDS.md` §0), 카탈로그는 남의
#    표준(schema.org·RFC 9309)을 AVR 기준으로 만족시키는 **예시**다. 우리가 발명한
#    마크업을 사이트에 심게 하는 방향이 아니다 -- 그 방향은 AI 제공사가 안 읽으면
#    가치가 정확히 0 이다.
#
# ⚠️ 그리고 **붙여넣기가 되는 부분이 제일 안 중요한 부분이다.** artifact 12개는
#    대부분 1층(도달)과 3층 마크업이고, AVR 의 3층 모델은 "승부는 2·3층에서 난다,
#    1층은 필요조건이지 충분조건이 아니다" 라고 말한다. 카탈로그를 전부 적용해도
#    ARS 는 오르고 AVI 는 안 움직일 수 있다. 그때 필요한 것은 더 많은 처방이 아니라
#    콘텐츠다.

# 0.2.0 — artifact 12개 중 12개가 발행됐다. 0.1.0 은 P3-01 한 건이었고, 검증기가
#         산출물을 `<head>` 에 넣은 HTML 한 장만 만들 수 있어 나머지를 등재할 수
#         없었다(robots.txt 는 HTML 이 아니고, 비율 항목은 분모가 필요하며, 날짜
#         표기는 화면에 있어야 한다). 처방 파일에 `fixture`(자리)와 `verify.ceiling`
#         (자동 판정의 천장)을 더해 그 셋을 풀었다. 분류표 자체는 바뀌지 않았다 --
#         45항목의 fix_kind 는 한 줄도 고치지 않았다.
# 0.3.0 — structure 11개 중 11개가 발행됐다. 0.2.0 은 P2-09 한 건이었다.
#         여덟은 담당 수집기로 예시를 돌려 검증했고(그중 둘 — P2-02·P2-07 — 은
#         2 가 아니라 **자동 판정의 천장**에 닿는다), 둘(P1-08·P2-01)은 담당
#         수집기가 없어 `not_verifiable` 로 그 사실을 적었다. 분류표 자체는 바뀌지
#         않았다 -- 45항목의 fix_kind 는 한 줄도 고치지 않았다.
version: "0.4.0"

fix_kinds:
  artifact: |
    치환값만 채우면 끝나는 산출물. 카탈로그가 전문을 준다.
    **담당 수집기가 반드시 있어야 등재된다** -- 적용 결과를 못 재면 그 처방은
    "이렇게 하면 점수가 오릅니다" 라는 근거 없는 약속이다.
  structure: |
    틀은 주되 내용은 고객 것. 문장을 대신 써줄 수 없다.
    P2(추출성) 전부가 여기다 -- 이 층이 AVR 이 말하는 승부처인데, 카탈로그가
    가장 못 주는 곳이기도 하다.
  fact: |
    마크업은 주지만 **아직 없는 사실을 만들어야** 한다.
    Organization 의 name·logo 는 회사가 있으면 이미 있으므로 artifact 지만,
    sameAs 의 위키데이터 항목은 없을 수 있으므로 fact 다. 그 경계가 이 분류의 핵심.
  infra: |
    HTML 이 아니다. 서버 설정·CDN·렌더링 아키텍처.
    P1-03(JS 없이 본문 렌더링)이 blocking 인데 여기 속한다 -- 게이팅을 푸는 조치가
    스니펫이 아니라 SSR/SSG 도입이라는 뜻이다.
  process: |
    운영 절차. 체크리스트는 줄 수 있고 코드는 아니다.
    외부 콘솔 등록, 여러 채널의 정보 일치, 주기적 점검이 여기다.
  none: |
    **카탈로그가 줄 수 있는 것이 없다.**
    사이트를 고쳐서 되는 일이 아니다. 여기에 처방을 다는 순간 우리는 대행이 되고,
    그것도 못 하는 대행이 된다. `remediation: earned` 는 언제나 여기에 온다.

items:
  # ── P1 접근성 (25점) ──────────────────────────────────────────
  P1-01: artifact     # robots.txt 전문
  P1-02: artifact     # AI 봇별 User-agent 블록
  P1-03: infra        # SSR/SSG/프리렌더 — blocking 인데 스니펫이 아니다
  P1-04: artifact     # llms.txt 전문 (단 evidence_grade=unverified)
  P1-05: artifact     # sitemap.xml
  P1-06: infra        # TTFB — 서버·CDN
  P1-07: infra        # 상태코드·리다이렉트
  P1-08: structure    # 고아 페이지 = 내부 링크 구조(IA). 붙여넣을 것이 아니다
  P1-09: infra        # 반응형·렌더링
  P1-10: process      # 서치어드바이저 등록 (Yeti 허용 부분은 P1-02 가 덮는다)

  # ── P2 추출성 (25점) — 전부 글쓰기 ────────────────────────────
  P2-01: structure
  P2-02: structure
  P2-03: structure
  P2-04: structure
  P2-05: structure
  P2-06: structure
  P2-07: structure
  P2-08: structure
  P2-09: structure
  P2-10: structure    # 헤딩 id·TOC. 마크업이지만 헤딩마다 달라 전문을 못 준다

  # ── P3 기계가독성 (20점) — 카탈로그가 가장 잘 하는 곳 ─────────
  P3-01: artifact
  P3-02: artifact
  P3-03: artifact
  P3-04: artifact
  P3-05: artifact
  P3-06: artifact
  P3-07: fact         # sameAs — 위키데이터·링크드인 항목이 **없을 수 있다**
  P3-08: process      # NAP 일관성 — 여러 채널의 정보를 맞추는 운영
  P3-09: process      # 검증 통과 — 앞 항목들을 고치고 도구로 확인하는 절차

  # ── P4 권위 (20점) — 절반이 우리가 못 주는 것 ─────────────────
  P4-01: fact         # 저자를 **지정**하는 결정이 필요하다
  P4-02: fact
  P4-03: none         # 권위 백링크 — earned
  P4-04: none         # 무링크 브랜드 언급 — earned
  P4-05: none         # 제3자 카테고리 정의 일치도 — earned
  P4-06: none         # 언론 커버리지 — earned
  P4-07: none         # 원본 데이터·1차 관점 — 템플릿이 존재할 수 없다
  P4-08: fact         # About 페이지 — 설립연도·대표자는 있지만 글은 써야 한다
  P4-09: process      # 네이버 생태계 등록·운영

  # ── P5 신선도·운영 (10점) ─────────────────────────────────────
  P5-01: artifact     # datePublished + <time>
  P5-02: artifact     # dateModified + <time>
  P5-03: process      # 갱신 주기 — 발행 운영
  P5-04: process      # 깨진 외부 링크 점검
  P5-05: process      # 변경 이력 기록
  P5-06: process      # 콘텐츠 리뷰 체계
  P5-07: process      # 내부 링크 점검
