# P2-03 헤딩-본문 일치
#
# **이 처방은 붙여넣는 것이 아니다.** 아래 `example` 은 채워진 예시이고, 당신의
# 글은 당신이 써야 한다. 우리가 확인할 수 있는 것은 하나뿐이다 -- 이 **틀이 2점에
# 닿을 수 있다**. 당신 글이 2점이 된다는 뜻이 아니다.

item_id: P2-03

target_state: |
  헤딩의 표제어가 **직후 2문단 안에 등장하지 않는 섹션이 15% 미만**이고, 모든
  H2 가 직후 **첫 문장에서** 그 표제어를 다시 언급한다.

  요령은 하나다 — **헤딩의 명사를 첫 문장에 그대로 다시 쓴다.** "현황 조사"라고
  썼으면 첫 문장이 "현황 조사는 …"으로 시작한다. 사람이 읽기엔 군더더기처럼
  보이지만, 문서를 조각으로 잘라 색인하는 쪽에서 보면 헤딩과 본문이 따로 떨어져도
  그 조각이 무엇에 대한 것인지 남는다.

  피해야 할 것은 대명사로 받는 습관이다. "현황 조사"라는 헤딩 아래 첫 문장이
  "이 단계에서는 …"이면 표제어가 본문에 한 번도 등장하지 않는다.

example: |
  <h1>재고관리 시스템 도입 절차</h1>
  <p>재고관리 시스템 도입은 현황 조사, 데이터 이관, 인수인계 세 단계로 나뉜다.</p>
  <h2>현황 조사는 무엇을 세는가</h2>
  <p>현황 조사는 창고별 품목 수와 입출고 빈도를 센다. 이 수치가 이후 선택의 근거가 된다.</p>
  <h2>데이터 이관은 어떻게 하는가</h2>
  <p>데이터 이관은 기존 엑셀을 CSV 로 내보내는 일부터 시작한다. 품목 코드가 겹치면 먼저 정리한다.</p>
  <h2>인수인계는 언제 시작하는가</h2>
  <p>인수인계는 도입 4주차에 시작한다. 담당자 두 명이 함께 한 주를 보낸다.</p>

not_verifiable: null

verify:
  collector: StructureCollector
  demonstrates_level: 2
  note: |
    골든 케이스 `remedy-p2-03-example-demonstrates-two` 가 **이 파일을 직접 읽어**
    돌린다. 어느 H2 의 첫 문장에서 표제어를 빼면(대명사로 받으면) 그 케이스가
    빨개진다.

    `demonstrates_level` 은 `expect_level` 과 다른 주장이다 -- 이 예시가 2점을
    받는다는 것이지, 이 틀을 따른 모든 글이 2점이 된다는 것이 아니다.

fixture:
  # P2-03 은 홈 한 장의 섹션들을 본다. 예시가 문서 그 자체이므로 `document` 다 --
  # 러너의 보일러플레이트(`<h1>t</h1><p>본문</p>`)가 얹히면 표제어 "t" 가
  # 본문에 없는 섹션이 하나 더 생겨 미일치 비율이 올라간다.
  place: document
  targets: ["/"]

adapters:
  - platform: any
    where: "글을 쓰는 곳 어디든. 이것은 마크업이 아니라 **첫 문장을 어떻게 여는가**다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다. 틀이 2점에 닿는다는 것만 골든
      케이스로 확인했다"
