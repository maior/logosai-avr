# P5-04 깨진 외부 링크
#
# `process` 분류 — 붙여넣을 코드가 없고 **주기적으로 하는 일**이다. 한 번 고치고 끝나지
# 않는다는 점이 infra 와 다르다. 외부 링크는 우리가 아무것도 안 해도 상대가 사라지면서
# 깨진다.

item_id: P5-04

target_state: |
  확인에 성공한 외부 링크 중 broken(404·410·5xx) 비율이 **3% 미만**이고, 리다이렉트
  체인이 3홉을 넘는 링크가 0건이다. (확인 못 한 비율이 50%를 넘으면 판정하지 않는다 —
  절반을 못 봤으면 나머지의 비율은 비율이 아니다.)

  **왜 인용에 관계되는가**: 깨진 출처를 단 문서는 AI 답변 엔진이 근거로 쓰기 어렵다.
  사람 독자에게도 같지만, 기계는 그것을 문서 전체의 신뢰도 신호로 집계한다.

steps:
  - "외부 링크를 전수 확인한다. HEAD 로 먼저 보고 405 가 오면 GET 으로 다시 본다 —
    HEAD 를 막아 둔 사이트가 꽤 있어서 HEAD 만 보면 멀쩡한 링크가 깨진 것으로 잡힌다."
  - "404·410 은 대체 출처를 찾거나 링크를 뗀다. **리다이렉트로 덮지 않는다** —
    상태코드는 좋아지지만 독자는 여전히 없는 문서로 간다."
  - "리다이렉트 체인이 3홉을 넘으면 최종 주소로 바로 건다. 체인은 크롤 예산을 쓰고
    중간 홉이 언제 끊길지 모른다."
  - "**주기를 정한다.** 외부 링크는 우리가 가만히 있어도 깨지므로 한 번 고치고 끝나지
    않는다. 분기 1회가 흔한 선택이고, 그 주기를 P5-06(리뷰 체계)에 적어 둔다."

verify:
  collector: FreshnessCollector
  demonstrates_level: 2
  note: |
    "예시" 는 마크업이 아니라 **그 링크 상태를 가진 사이트**다. 픽스처가 외부 링크를
    200 으로 응답하게 해서 잰다.

    목표 상태가 실제로 그 점수를 만드는지 양쪽으로 확인했다(실측): 전부 200 → 2,
    외부 링크 하나가 404 → 0. 그리고 그 위반이 P5-07(내부 링크)·P5-03(갱신 주기)은
    건드리지 않는다 — 세 항목을 **구별해 서술할 근거**가 거기 있다.

fixture:
  serves: ["/", "/a"]
  extra_urls: ["/a"]
  # 링크가 없으면 "깨진 링크 비율" 의 분모가 없어 판정되지 않는다. 목표 상태를
  # 가진 사이트를 지으려면 **살아 있는 외부 링크**가 있어야 한다.
  links: ["https://ok.example/x"]

adapters:
  - platform: any
    where: "링크 검사는 CI 에 넣는 것이 가장 싸다. 배포 전에 도는 검사 하나면 새로
      깨지는 링크는 막히고, 남는 것은 시간이 지나 깨지는 기존 링크뿐이다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다"
