# P2-07 표·리스트 사용
#
# **이 처방은 붙여넣는 것이 아니다.** 아래 `example` 은 채워진 예시이고, 무엇을
# 비교할지는 당신이 정해야 한다. 그리고 이 항목은 **예시만으로는 2점에 닿지
# 않는다** -- level 2 가 "어떤 콘텐츠가 비교형인가"라는 분류를 요구하기 때문이다.
# 아래 `ceiling` 이 어디서 멈추는지를 적는다.

item_id: P2-07

target_state: |
  **비교·선택형 콘텐츠마다** `<th>` 헤더를 갖춘 표가 최소 하나 있고, **절차형
  콘텐츠에는** `<ol>` 을 쓰며, 표의 내용이 이미지가 아니라 텍스트다.

  세 조건 중 마지막이 한국 사이트에서 가장 자주 깨진다. 비교표를 이미지 한 장으로
  올리면 사람은 읽지만 기계는 아무것도 못 읽는다. **표가 이미지면 그 표는 없는
  것과 같다.**

  `<th>` 를 요구하는 이유도 같다. `<td>` 만으로 만든 표는 화면에서는 표처럼 보여도
  어느 칸이 항목명이고 어느 칸이 값인지 표시가 없다. 첫 행을 `<th>` 로 바꾸는
  것은 한 줄 고치는 일이고, 그 한 줄이 표를 데이터로 만든다.

  `<ol>` 과 `<ul>` 의 구분도 표시다 -- 순서가 있는 절차에 `<ul>` 을 쓰면 "순서가
  중요하지 않다"고 적는 셈이다.

example: |
  <h1>재고관리 도구 비교와 도입 절차</h1>
  <p>도구마다 요금과 연동 범위가 다르다. 아래 표로 비교한다.</p>
  <h2>도구별 비교</h2>
  <table>
    <tr><th>도구</th><th>월 요금</th><th>엑셀 연동</th></tr>
    <tr><td>A 도구</td><td>3만 원</td><td>지원</td></tr>
    <tr><td>B 도구</td><td>5만 원</td><td>미지원</td></tr>
  </table>
  <h2>도입 절차</h2>
  <ol>
    <li>창고별 품목 수와 입출고 빈도를 센다</li>
    <li>엑셀 장부를 CSV 로 내보내 일괄 등록한다</li>
    <li>도입 4주차에 현업 담당자에게 넘긴다</li>
  </ol>

not_verifiable: null

verify:
  collector: StructureCollector
  # **천장.** `demonstrates_level` 을 적을 수 없다 -- 마크업을 완전히 갖춘 예시가
  # 오히려 미판정으로 간다. 1 을 적으려면 `<th>` 를 빼거나 `<ol>` 을 빼야 하는데,
  # 그건 처방을 나쁘게 고쳐 숫자를 만드는 일이라 하지 않는다.
  demonstrates_unavailable_kind: inconclusive
  ceiling: |
    rubric v1.7.0 P2-07 levels."2" 는 마크업만으로 판정되지 않는다 — "**비교·선택형
    콘텐츠마다** `<th>` 헤더를 갖춘 표 최소 1개, **절차형 콘텐츠에** `<ol>` 사용".
    두 조건 모두 "이 페이지가 비교형인가 절차형인가"라는 **콘텐츠 유형 분류**를
    전제하고, 그 분류는 문서 안에 표시로 존재하지 않는다.

    그래서 감사는 마크업이 갖춰졌다는 사실까지만 확인하고 `inconclusive` 로 멈춘다.
    이 예시는 표에 `<th>` 와 텍스트 셀이 있고 `<ol>` 도 있어 **확인 가능한 조건은
    전부 통과한 상태**이며, 남은 것은 우리가 못 보는 조건이다.

    `demonstrates_level: 2` 로 적으면 거짓이고, 1 로 적으려면 levels."1"(표에 `<th>`
    가 없거나 비교형 콘텐츠에 표가 없음)에 맞춰 예시를 나쁘게 고쳐야 한다.

    **미판정은 0점이 아니다.** ARS 점수 분모에서는 빠지고 `unscored_item_ids` 로
    공시되지만, `inconclusive` 는 커버리지 분모에 **남는다** (spec §8.2·§8.3).
  note: |
    골든 케이스 `remedy-p2-07-example-stops-at-content-typing` 이 **이 파일을 직접
    읽어** 돌린다. 표의 첫 행 `<th>` 를 `<td>` 로 바꾸거나 `<ol>` 을 지우면 판정이
    level 1 로 내려가 그 케이스가 빨개진다 -- 천장에 닿는 것 자체가 이 케이스가
    재는 값이다.

fixture:
  # 예시가 문서 그 자체다. 표와 리스트는 홈 한 장에서 세므로 `document` + "/" 다.
  place: document
  targets: ["/"]

