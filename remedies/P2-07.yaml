      대개 '헤더 행'과 '번호 매기기' 버튼이다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다. 예시가 자동 판정의 천장까지
      간다는 것만 골든 케이스로 확인했다"
