# P3-06 HowTo · BreadcrumbList
#
# 한 항목이 서로 다른 두 마크업을 AND 로 요구한다 -- 둘 중 하나만 있으면 level 1 이다.
# 그래서 산출물도 한 덩어리(@graph)로 준다. 두 조각으로 나눠 주면 한쪽만 붙이고
# "했는데 1 점" 이 되는 일이 반복된다.
#
# 둘의 성격은 다르다. BreadcrumbList 는 **모든 깊은 페이지**에 있어야 하는 구조
# 신호이고, HowTo 는 **절차를 설명하는 문서에만** 붙이는 내용 신호다. 절차가 아닌
# 글에 HowTo 를 붙이는 것은 점수를 위한 거짓 선언이고, 그건 P3-09 쪽에서 경고로 돌아온다.

item_id: P3-06

target_state: |
  절차형 문서에 `@type: HowTo`(**step 3개 이상**)가 있고, 2단계 이상 깊이의 페이지에
  `@type: BreadcrumbList`(**2단계 이상**)가 있다. 둘 다 있어야 level 2 다.

  BreadcrumbList 가 하는 일: 이 페이지가 사이트의 **어디에 속하는지**를 말한다.
  URL 경로만으로는 계층이 의미인지 라우팅 편의인지 기계가 구분할 수 없다. 답변
  엔진이 "이 회사의 무슨 페이지인가" 를 판단할 때 쓰는 몇 안 되는 명시적 신호다.

  HowTo 가 하는 일: 절차를 **순서 있는 단계**로 선언한다. 답변 엔진이 "어떻게 하나요"
  질문에 단계 목록으로 답할 때, 이미 단계로 쪼개진 문서가 쪼개지지 않은 문서보다
  인용하기 쉽다 -- 다만 이것은 구조상 그럴 것이라는 추론이고 우리가 관측한 사실이
  아니다(rubric 의 근거 등급 참조).

  step 이 3개 미만이면 level 1 이다. 절차가 2단계뿐이라면 그것은 절차형 문서가
  아닐 가능성이 높고, 그때는 HowTo 를 억지로 붙이는 대신 안 붙이는 것이 맞다.

artifact: |
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "BreadcrumbList",
        "@id": "{{PAGE_URL}}#breadcrumb",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "{{CRUMB_1_NAME}}",
            "item": "{{SITE_URL}}/" },
          { "@type": "ListItem", "position": 2, "name": "{{CRUMB_2_NAME}}",
            "item": "{{SITE_URL}}{{CRUMB_2_PATH}}" },
          { "@type": "ListItem", "position": 3, "name": "{{HOWTO_NAME}}",
            "item": "{{PAGE_URL}}" }
        ]
      },
      {
        "@type": "HowTo",
        "@id": "{{PAGE_URL}}#howto",
        "name": "{{HOWTO_NAME}}",
        "description": "{{HOWTO_DESCRIPTION}}",
        "step": [
          { "@type": "HowToStep", "position": 1, "name": "{{STEP_1_NAME}}",
            "text": "{{STEP_1_TEXT}}", "url": "{{PAGE_URL}}#step1" },
          { "@type": "HowToStep", "position": 2, "name": "{{STEP_2_NAME}}",
            "text": "{{STEP_2_TEXT}}", "url": "{{PAGE_URL}}#step2" },
          { "@type": "HowToStep", "position": 3, "name": "{{STEP_3_NAME}}",
            "text": "{{STEP_3_TEXT}}", "url": "{{PAGE_URL}}#step3" }
        ]
      }
    ]
  }
  </script>

placeholders:
  - key: "{{PAGE_URL}}"
    meaning: "이 문서의 절대 URL. (적합성 러너는 픽스처 페이지 URL 로 자동 치환한다)"
  - key: "{{SITE_URL}}"
    meaning: "사이트 정본 URL (끝 슬래시 없이)"
  - key: "{{CRUMB_1_NAME}}"
    meaning: "1단계 이름. 대개 `홈`. 화면의 빵부스러기 UI 와 같은 말이어야 한다"
  - key: "{{CRUMB_2_NAME}}"
    meaning: "2단계 이름 (예: `가이드`). **화면에 없는 계층을 마크업에만 만들지 마라**"
  - key: "{{CRUMB_2_PATH}}"
    meaning: "2단계의 경로 (예: `/guides`). 슬래시로 시작하고 실제로 200 이어야 한다"
  - key: "{{HOWTO_NAME}}"
    meaning: "절차의 이름. 문서 제목과 같게 한다. 빵부스러기 3단계 이름으로도 쓰인다"
  - key: "{{HOWTO_DESCRIPTION}}"
    meaning: "이 절차가 무엇을 달성하는지 한 문장. '무엇을 하는 법' 형태"
  - key: "{{STEP_1_NAME}}"
    meaning: "1단계의 짧은 이름. 화면 소제목(H2/H3)과 같게 하면 앵커(P2-10)와도 맞물린다"
  - key: "{{STEP_1_TEXT}}"
    meaning: "1단계에서 **실제로 하는 일**. 화면 본문에 있는 설명과 같은 내용이어야 한다"
  - key: "{{STEP_2_NAME}}"
    meaning: "2단계의 짧은 이름"
  - key: "{{STEP_2_TEXT}}"
    meaning: "2단계에서 하는 일"
  - key: "{{STEP_3_NAME}}"
    meaning: "3단계의 짧은 이름. rubric 최소치가 3단계이며, 2단계면 level 1 이다"
  - key: "{{STEP_3_TEXT}}"
    meaning: "3단계에서 하는 일. 단계가 더 있으면 같은 모양으로 이어 붙인다"

verify:
  collector: SchemaOrgCollector
  expect_level: 2
  note: |
    골든 케이스 `remedy-p3-06-artifact-scores-two` 가 이 산출물을 2단계 깊이의 문서
    페이지에 놓고, 그 페이지를 대표 문서 집합으로 넘겨 돌린다. step 을 2개로 줄이거나
    BreadcrumbList 를 지우면 빨개진다 -- 두 조건이 AND 라는 사실이 케이스로 고정된다.

