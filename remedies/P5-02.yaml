    where: "CMS·git 의 실제 수정 시각을 프런트매터로 받아 `<time>` 과 JSON-LD 에 함께 렌더링"
    status: unconfirmed
    note: "확인 안 함. 파일시스템 mtime 을 쓰면 체크아웃마다 바뀌어 빌드 시각과 같아진다 —
      형식은 충족하고 의도는 어기는 전형적인 경로인데, 실제로 재본 적 없다"
  - platform: wordpress
    where: "테마 템플릿에서 the_modified_time() 을 `<time datetime>` 과 함께 출력"
    status: unconfirmed
    note: "확인 안 함. 워드프레스의 post_modified 는 오탈자 수정이나 카테고리 변경에도
      갱신되므로 '본문 변경 시에만' 과 어긋날 수 있다"
  - platform: cafe24
    where: "관리자 > 디자인 > HTML 편집 (게시판 본문 레이아웃)"
    status: unconfirmed
    note: "확인 안 함. 수정일 치환 변수가 있는지, 있다면 목록·본문 어디에서 쓸 수 있는지
      확인하지 못했다"
