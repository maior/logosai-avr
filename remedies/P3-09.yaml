# P3-09 구조화 데이터 검증 통과
#
# `process` 분류. 앞의 P3-01~07 을 고친 뒤 **도구로 확인하는 절차**이고, 그래서 이
# 항목만 따로 고칠 것은 없다.

item_id: P3-09

target_state: |
  검사 대상 페이지 전체에서 구조화 데이터 **오류 0건**, 경고는 페이지당 평균 2건 이하.

  "오류" 와 "경고" 는 다르다. 오류는 그 마크업이 무시된다는 뜻이고, 경고는 권장 속성이
  빠졌다는 뜻이다. 앞의 항목들(P3-01~07)을 제대로 채우면 오류는 대개 0 이 되고 남는
  것은 경고다.

steps:
  - "구글 리치 결과 테스트와 schema.org validator 에 대표 페이지를 넣는다.
    둘은 보는 것이 다르다 — 앞은 구글이 실제로 쓰는 타입만, 뒤는 어휘 전체를 본다."
  - "오류를 먼저 0 으로 만든다. 대부분 필수 속성 누락이거나 타입 오기다."
  - "경고는 우선순위를 매긴다. 인용에 관계되는 것(author·datePublished·publisher)을
    먼저 채우고, 표시 관련 권장 속성은 뒤로 미뤄도 된다."
  - "**배포 파이프라인에 검사를 넣는다.** 구조화 데이터는 템플릿 한 줄이 바뀌면
    전 페이지가 동시에 깨지는 종류라, 사후 발견이 가장 비싸다."

verify:
  collector: SchemaOrgCollector
  demonstrates_unavailable_kind: input_missing
  ceiling: |
    **파싱 오류가 0 이어도 자동 판정은 level 1·2 를 가르지 못한다.** rubric 이
    "경고 페이지당 평균 2건 이하" 를 요구하는데, 그 경고는 **구글 리치 결과 테스트의
    출력**이지 우리가 HTML 을 읽어 낼 수 있는 값이 아니다.

    실측으로 확인했다 — 유효한 JSON-LD 를 담은 픽스처가 `input_missing` 을 낸다
    ("파싱 오류는 0건이나, level 1·2 를 가르는 '경고(warning) 건수'는 리치 결과 테스트
    결과가 있어야 산출 가능").

    남의 도구 출력을 우리 진단에 끌어오지 않는 이유: 그 도구의 판정 기준이 바뀌면 우리
    점수가 조용히 바뀌고, 우리는 그 변경을 통제하지도 관측하지도 못한다.

fixture:
  place: head
  targets: ["/"]
  requires: ["P3-01"]

adapters:
  - platform: any
    where: "CI 에 구조화 데이터 검사를 추가. 로컬에서는 schema.org validator 의 API 를
      쓸 수 있다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다"
