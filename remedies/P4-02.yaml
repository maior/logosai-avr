# P4-02 저자 자격 검증 가능성
#
# **이 처방은 우리가 효과를 확인하지 못한 조언이다.** rubric 이 `check: manual` 로
# 지정한 항목이라 담당 수집기가 없고, 앞으로도 만들 계획이 없다 — 링크 저편의 학회
# 페이지가 이 사람의 것인지는 사람이 읽어야 안다.

item_id: P4-02

target_state: |
  저자 프로필에 **자격·소속·경력을 제3자가 확인할 수 있는 출처** 링크가 2개 이상 있다.
  학회·협회 회원 페이지, 논문(DOI·구글 스칼라), 언론 기고문, 기업 공식 구성원 페이지가
  여기 해당한다.

  자기 사이트 안의 다른 페이지는 제3자 출처가 아니다. "10년 경력" 이라고 **적는 것**과
  그 경력을 **확인할 수 있는 것**은 다르고, 이 항목이 재는 것은 뒤엣것이다.

  P4-01(저자 표기)이 "누가 썼는가" 라면 이것은 "그 사람이 이 주제에 대해 말할 자격이
  있는가" 다. 앞엣것 없이는 성립하지 않으므로 P4-01 을 먼저 한다.

prerequisites:
  - what: "저자 본인의 제3자 출처 2개 이상"
    why: "이건 마크업으로 만들 수 없다. 학회 가입·논문·기고처럼 **시간이 드는 일**이고,
      없는 사람에게 만들어 줄 수도 없다. 링크를 지어내면 이 항목이 재려는 것과 정확히
      반대가 된다"
  - what: "그 출처를 공개해도 좋다는 저자의 동의"
    why: "소속과 경력은 개인 정보다. 회사가 임의로 올릴 일이 아니다"

artifact: |
  <section class="author-credentials">
    <h2>{{AUTHOR_NAME}}</h2>
    <p>{{AUTHOR_BIO}}</p>
    <ul>
      <li><a href="{{CREDENTIAL_URL_1}}" rel="nofollow">{{CREDENTIAL_LABEL_1}}</a></li>
      <li><a href="{{CREDENTIAL_URL_2}}" rel="nofollow">{{CREDENTIAL_LABEL_2}}</a></li>
    </ul>
  </section>

placeholders:
  - key: "{{AUTHOR_NAME}}"
    meaning: "저자 실명. P4-01 의 바이라인과 같은 표기여야 한다"
  - key: "{{AUTHOR_BIO}}"
    meaning: "소개 산문 한두 문장. 글 목록만 있는 태그 페이지는 프로필이 아니다"
  - key: "{{CREDENTIAL_URL_1}}"
    meaning: "제3자 출처 주소. **자기 사이트 안이면 안 된다**"
  - key: "{{CREDENTIAL_LABEL_1}}"
    meaning: "무엇을 가리키는 링크인지. 예: '대한피부과학회 정회원'"
  - key: "{{CREDENTIAL_URL_2}}"
    meaning: "두 번째 제3자 출처"
  - key: "{{CREDENTIAL_LABEL_2}}"
    meaning: "두 번째 링크의 설명"

not_verifiable: |
  담당 수집기가 없고 **만들 계획도 없다.** rubric 이 `check: manual` 로 지정한 항목이다.

  링크의 존재와 응답까지는 기계가 볼 수 있지만, level 2 가 요구하는 것은 그 너머다 --
  "그 학회 페이지가 **이 저자의** 것인가", "그 논문의 저자가 **동일인**인가". 동명이인이
  흔한 한국어 환경에서 이름 일치만으로 단정하면 오탐이 구조적으로 생기고, 그 오탐은
  **사람의 자격에 대한 거짓 주장**이라 다른 항목의 오탐보다 나쁘다.

  P3-07 과 같은 종류의 한계이되 거기보다 한 발 더 나가 있다 -- 저쪽은 수집기가 링크
  조건까지는 재고 천장에서 멈추지만, 이쪽은 애초에 수집기를 두지 않았다.

adapters:
  - platform: any
    where: "저자 프로필 페이지 안. P4-01 의 `{{AUTHOR_PROFILE_URL}}` 이 가리키는 그 페이지다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없고, 우리 수집기로는 확인할 방법도 없다"
