# P1-03 JavaScript 없이 본문 렌더링  (**blocking**)
#
# rubric 의 blocking 항목 둘 중 하나다. 0점이면 총점이 40 으로 잘린다 — 다른 걸 아무리
# 잘해도 소용없다는 뜻이고, 실제로 그게 맞다. 크롤러가 본문을 못 받으면 나머지 44항목이
# 무엇을 하든 답변에 실릴 문장이 없다.
#
# **붙여넣을 코드가 없다.** 이건 설정이 아니라 아키텍처 결정이다.

item_id: P1-03

target_state: |
  홈과 대표 페이지의 **최초 HTTP 응답 본문**에 H1 과 첫 문단이 그대로 들어 있고,
  JS 실행 후 본문 대비 80% 이상의 텍스트가 이미 존재한다.

  확인은 한 줄로 된다.

      curl -s https://example.com | grep -o '<h1[^>]*>[^<]*'

  아무것도 안 나오면 크롤러도 아무것도 못 받는다. 브라우저로 보면 멀쩡한 것은
  브라우저가 JS 를 돌리기 때문이고, 크롤러 중 상당수는 돌리지 않는다.

  **"메타태그를 넣었는데 왜 안 되나" 의 답이 대개 여기 있다.** 1층(도달)이 막히면
  2·3층은 시작되지 않는다.

steps:
  - "`curl -s <URL> | wc -c` 와 브라우저 DOM 의 본문 길이를 비교한다. 응답 본문이
    수 KB 인데 화면에는 글이 가득하면 CSR 이다."
  - "프레임워크가 있으면 렌더링 모드를 바꾼다 — Next.js 는 서버 컴포넌트/SSG,
    Nuxt 는 `ssr: true`, SvelteKit 은 prerender. **새로 쓰는 것이 아니라 설정과
    데이터 취득 위치를 옮기는 일**인 경우가 많다."
  - "프레임워크를 못 바꾸면 프리렌더링을 앞에 둔다(빌드 시 정적 HTML 생성 또는
    엣지 프리렌더). 크롤러에게만 다른 HTML 을 주는 방식(클로킹)은 쓰지 않는다 —
    제공사 정책 위반이고, 발각되면 색인에서 빠진다."
  - "고친 뒤 **curl 로** 재확인한다. 브라우저로 확인하면 고치기 전과 똑같이 보인다."

not_verifiable: |
  **우리 기본 설정으로는 이 항목을 판정하지 못한다.** level 2 는 "JS 실행 후 대비 80%"
  라는 **비교**를 요구하는데, 비교하려면 JS 를 실제로 돌려야 한다. 렌더러(Playwright)가
  주입되지 않으면 수집기는 명백한 CSR 셸만 0점으로 보고 나머지는 미판정으로 남긴다.

  실측으로 확인했다 — 완전한 SSR 픽스처를 넣어도 `input_missing` 이 나온다
  ("JS 실행 결과 대비 본문 비율을 잴 수 없음 (렌더러 미주입)").

  적합성 스위트를 Playwright 에 의존시키지 않는 이유: 그 패키지가 없는 환경에서
  스위트 전체가 죽는다. 제3자가 우리 명세를 재현하려는데 브라우저 설치부터 요구하면
  그건 공개 스위트가 아니다.

  **그래서 이 blocking 항목은 렌더러를 켜야만 제대로 잰다** (`AEO_RENDER_MODE=playwright`).
  안 켜면 게이팅이 늘 `gating_undetermined` 로 남는다. 그 상태 자체가 리포트에 공시된다.

