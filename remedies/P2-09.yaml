# P2-09 요약 진술문
#
# **이 처방은 붙여넣는 것이 아니다.** 아래 `example` 은 채워진 예시이고, 당신의 글은
# 당신이 써야 한다. 우리가 확인할 수 있는 것은 하나뿐이다 -- 이 **틀이 2점에 닿을 수
# 있다**. 당신 글이 2점이 된다는 뜻이 아니다.

item_id: P2-09

target_state: |
  1,000어절을 넘는 문서의 70% 이상에서, **본문이 시작되기 전**(H1 다음, 첫 하위 헤딩
  앞)에 요약 블록이 있다. 형태는 둘 중 하나다.

    · 3~5개의 짧은 항목            — 마커("요약"·"TL;DR")가 없어도 된다
    · 3문장 이내의 한 덩어리        — 이때는 마커가 있어야 한다

  뒤엣것에 마커를 요구하는 이유: 마커 없는 짧은 단일 문단은 요약이 아니라 그냥 리드
  문단이다. 그걸 요약으로 세면 거의 모든 글이 통과해 이 항목이 아무것도 재지 않는다.

  **왜 이게 인용에 관계되는가**: AI 답변 엔진은 문서를 조각으로 잘라 색인한다. 맨 앞
  조각에 결론이 없으면, 그 문서가 뽑히더라도 답에 쓸 문장이 없다.

example: |
  <h1>재고관리 시스템 도입 체크리스트</h1>
  <ul>
    <li>도입 전 현황 조사에 평균 2주가 걸린다</li>
    <li>기존 엑셀 데이터는 CSV 로 이관한다</li>
    <li>초기 비용은 사용자 수에 비례한다</li>
    <li>운영 인수인계는 도입 4주차에 시작한다</li>
  </ul>
  <h2>현황 조사</h2>
  <p>먼저 창고별 품목 수와 입출고 빈도를 센다. 이 수치가 이후 모든 선택의 근거가 된다.</p>

not_verifiable: null

verify:
  collector: SummaryBlockCollector
  demonstrates_level: 2
  note: |
    골든 케이스 `remedy-p2-09-example-demonstrates-two` 가 **이 파일을 직접 읽어**
    돌린다. 예시를 고쳐 틀이 깨지면 그 케이스가 빨개진다.

    `demonstrates_level` 은 `expect_level` 과 다른 주장이다 -- 이 예시가 2점을
    받는다는 것이지, 이 틀을 따른 모든 글이 2점이 된다는 것이 아니다.

fixture:
  place: document
  # 이 항목은 1,000어절 초과 문서만 대상으로 한다. 예시를 그만큼 길게 쓰면 아무도 안
  # 읽으므로 **전제만** 픽스처가 채운다 — 판정 대상인 요약 블록은 예시 그대로다.
  pad_eojeol: 1200
  targets: ["/guides/a", "/guides/b", "/guides/c"]
  extra_urls: ["/guides/a", "/guides/b", "/guides/c"]

adapters:
  - platform: any
    where: "글을 쓰는 곳 어디든. 이것은 마크업이 아니라 **글의 순서**다 —
      CMS·정적 사이트·수기 HTML 어디서도 같다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다. 틀이 2점에 닿는다는 것만 골든
      케이스로 확인했다"
