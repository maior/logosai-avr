# P1-09 모바일·데스크톱 콘텐츠 일치
#
# `infra` 분류이자 **우리가 만들지 않기로 한** 수집기다.

item_id: P1-09

target_state: |
  모바일 UA 와 데스크톱 UA 에 **같은 본문**이 나가고(일치율 95% 이상), 접힌 UI
  (아코디언·더보기)도 DOM 에는 전문이 들어 있으며, canonical 이 하나다.

  핵심은 두 번째다. 모바일에서 "더보기" 뒤에 숨긴 텍스트를 **DOM 에서 빼는** 구현이
  흔한데, 그러면 모바일 UA 로 오는 크롤러에게 그 문단은 존재하지 않는다. CSS 로
  가리는 것과 DOM 에서 없애는 것은 다르다.

steps:
  - "같은 URL 을 데스크톱 UA 와 모바일 UA 로 각각 받아 본문 길이를 비교한다.
    차이가 크면 서버가 UA 로 분기하고 있다."
  - "접힘 UI 의 구현을 본다. `display:none` 은 괜찮고, 클릭 전까지 DOM 에 넣지 않는
    지연 삽입은 크롤러에게 그 내용이 없는 것과 같다."
  - "m. 서브도메인을 따로 운영한다면 양쪽 canonical 이 한 곳을 가리키는지 확인한다.
    반응형으로 합치는 것이 근본 해결이다."

not_verifiable: |
  **담당 수집기가 없고 만들지 않기로 했다.** 이 항목을 재려면 모바일 UA 로 요청을
  보내야 하는데, 그것은 우리 크롤러가 **정체를 숨기는 일**이다.

  우리 User-Agent 규칙은 "사람 브라우저를 사칭하지 않는다 — 사칭하는 순간 우리는 우리가
  진단하는 바로 그 문제(정체를 숨기는 AI 크롤러)의 사례가 된다" 이다
  (`app/audit/base.py`). 그 규칙을 이 항목 하나를 위해 깨지 않는다.

  P1-06 과 이유가 다르다 -- 저쪽은 픽스처의 한계이고, 이쪽은 **우리가 그렇게 하지
  않기로 한 것**이다. 그 차이가 로드맵을 가른다: 저쪽은 언젠가 실환경 측정으로 풀 수
  있고, 이쪽은 풀지 않는다.

adapters:
  - platform: any
    where: "반응형 CSS 와 접힘 UI 구현. UA 분기를 쓰지 않는 것이 근본이다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없고, 우리 수집기로는 확인할 방법도 없다"
