# P3-08 NAP 일관성
#
# `process` 분류이자 **검증 수단이 없는** 처방이다. 아래 `not_verifiable` 이 이유를 밝힌다.

item_id: P3-08

target_state: |
  상호·주소·전화(Name·Address·Phone)가 자사 사이트, 네이버 플레이스, 구글 비즈니스
  프로필 **세 곳에서** 문자열 정규화 후 완전히 일치하고, `PostalAddress` 스키마로도
  같게 선언돼 있다.

  **왜 인용에 관계되는가**: 같은 업체가 채널마다 다른 정보를 내보이면 AI 답변 엔진은
  그것을 서로 다른 엔티티로 보거나, 어느 쪽을 믿을지 판단하지 못해 둘 다 안 쓴다.

steps:
  - >-
    세 곳의 표기를 나란히 놓고 대조한다. 띄어쓰기·괄호·층수 표기·전화번호 하이픈까지 본다.
  - >-
    정본을 하나 정한다. 보통 사업자등록증 표기를 따르는 것이 분쟁이 없다.
  - >-
    세 곳을 정본에 맞춰 고친다. 플랫폼마다 수정 반영에 며칠 걸린다.
  - >-
    자사 사이트에는 `PostalAddress` 스키마로도 같게 선언한다 — 사람이 읽는 표기와 기계가 읽는 표기가 갈리면 안 된다.

not_verifiable: |
  담당 수집기가 없다. 판정하려면 **네이버 플레이스와 구글 비즈니스 프로필을 긁어야**
  하는데, 둘 다 약관이 자동 수집을 제한하고 우리 크롤 규칙(robots.txt 존중, 호스트당
  요청 예산)으로는 그 데이터에 닿을 수 없다.

  자사 사이트 쪽 표기만 읽어 "일치한다" 고 말할 수는 없다 — 이 항목이 재는 것은
  **세 곳의 일치**이지 한 곳의 존재가 아니다.

adapters:
  - platform: any
    where: "각 플랫폼의 업체 정보 편집 화면. 코드가 아니다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없고, 우리 수집기로는 확인할 방법도 없다"
