# P4-08 About 페이지 명확성
#
# `fact` 분류다 — 마크업은 드리지만 **넣을 사실을 먼저 갖추셔야 한다.** 설립 연도와
# 대표자는 회사에 이미 있지만, "이 회사가 무엇을 하는가" 를 한 문장으로 적어 본 적이
# 없는 회사가 많다. 그 문장은 우리가 대신 쓸 수 없다.

item_id: P4-08

target_state: |
  회사 소개 페이지가 존재하고 홈 내비게이션에서 도달할 수 있으며, 다음 다섯이
  **모두** 본문에 있다.

    · 정의문      — "○○는 ~하는 회사/서비스입니다" 한 문장
    · 설립 연도    — "2018년 설립" 처럼 설립·창립 낱말과 함께
    · 대표자·팀    — "대표이사 ○○○" 또는 핵심 팀 소개
    · 사업자 정보  — 사업자등록번호 또는 소재지 (둘 중 하나면 된다)
    · 연락 수단    — 이메일·전화·문의 폼

  **왜 이게 인용에 관계되는가**: AI 답변 엔진이 브랜드를 출처로 달려면 그 브랜드가
  무엇인지 페이지에서 확인할 수 있어야 한다. 슬로건("당신의 내일을 바꿉니다")만 있는
  About 은 사람에게도 기계에게도 아무 정보가 없다.

prerequisites:
  - what: "한 문장 정의문"
    why: "슬로건이 아니라 '무엇을 하는 조직인가'에 답하는 문장이다. 없으면 이 항목은
      다른 넷을 다 갖춰도 0점이다 — 정의문이 없는 About 은 슬로건 페이지로 본다.
      대부분의 회사가 이 문장을 한 번도 명시적으로 써 본 적이 없다"
  - what: "공개할 대표자 또는 핵심 팀"
    why: "누구를 밝힐지는 회사가 정할 일이지 우리가 정할 수 없다. 1인 기업이면 대표
      본인, 법인이면 대표이사 표기가 보통이다"

artifact: |
  <h1>회사소개</h1>
  <p>{{ORG_NAME}}는 {{DEFINITION}}.</p>
  <p>{{FOUNDED_YEAR}}년 설립 이후 {{TRACTION}}.</p>
  <ul>
    <li>대표이사 : {{PRINCIPAL_NAME}}</li>
    <li>사업자등록번호 : {{BUSINESS_NUMBER}}</li>
    <li>주소 : {{ADDRESS}}</li>
    <li>문의 : <a href="mailto:{{CONTACT_EMAIL}}">{{CONTACT_EMAIL}}</a></li>
  </ul>

placeholders:
  - key: "{{ORG_NAME}}"
    meaning: "브랜드가 불리는 이름. 법인명과 다르면 브랜드 쪽을 쓴다"
  - key: "{{DEFINITION}}"
    meaning: "정의문의 술어. 예: '전국 피부과를 비교하고 예약하는 헬스케어 플랫폼입니다'.
      수식어가 아니라 **무엇을 하는가**를 적는다"
  - key: "{{FOUNDED_YEAR}}"
    meaning: "설립 연도 네 자리. '설립' 낱말과 가까이 있어야 기계가 연도로 읽는다 —
      '2018년 기준 120만 명' 같은 문장의 연도는 설립 연도가 아니다"
  - key: "{{TRACTION}}"
    meaning: "설립 이후의 사실 한 조각. 없으면 이 문장을 통째로 빼도 된다"
  - key: "{{PRINCIPAL_NAME}}"
    meaning: "대표자 실명. '관리자'·'운영팀' 같은 표기는 사람 이름으로 보지 않는다"
  - key: "{{BUSINESS_NUMBER}}"
    meaning: "사업자등록번호 (000-00-00000). 주소가 있으면 생략해도 이 항목은 충족된다"
  - key: "{{ADDRESS}}"
    meaning: "소재지. 사업자등록번호가 있으면 생략해도 된다"
  - key: "{{CONTACT_EMAIL}}"
    meaning: "실제 수신되는 주소"

verify:
  collector: AboutPageCollector
  expect_level: 2

fixture:
  place: document
  targets: ["/about"]
  extra_urls: ["/about"]

adapters:
  - platform: any
    where: "회사소개 페이지. **홈 내비게이션에서 링크되어야 한다** — 페이지가 있어도
      홈에서 못 찾으면 사람도 AI 도 도달하지 못한다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다"
