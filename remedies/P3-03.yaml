    where: "커스텀 포스트 타입 템플릿, 또는 SEO 플러그인의 스키마 타입 지정"
    status: unconfirmed
    note: "확인 안 함. 플러그인이 상품·서비스에 기본 스키마를 붙이는 경우 provider 가
      @id 참조가 아니라 인라인 Organization 객체로 나갈 수 있고, 그러면 level 1 이다"
  - platform: cafe24
