    status: unconfirmed
    note: "확인 안 함. 레이아웃에 두면 모든 페이지가 같은 @id 를 갖게 되므로 반드시
      페이지 컴포넌트에 둬야 하는데, 그 차이를 실제 적용으로 확인한 적 없다"
