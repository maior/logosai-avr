# P1-10 네이버 서치어드바이저 등록 및 Yeti 허용
#
# `process` 분류이자 **검증 수단이 없는** 처방이다. 아래 `not_verifiable` 이 이유를 밝힌다.

item_id: P1-10

target_state: |
  네이버 서치어드바이저에 사이트가 등록돼 **소유 확인이 끝나** 있고, robots.txt 가
  Yeti 를 허용하며, 사이트맵이 제출돼 있고, 웹마스터도구의 수집 진단에 미해결 오류가
  0건이다.

  **국내 사이트에 이것이 P1(도달)인 이유**: 네이버는 자체 크롤러(Yeti)로 수집하고,
  등록되지 않은 사이트는 수집 우선순위가 크게 낮다. robots.txt 만 열어 두는 것과
  등록까지 하는 것은 다르다.

steps:
  - >-
    서치어드바이저에 사이트를 등록하고 소유를 확인한다 (HTML 파일 업로드 또는 메타태그).
  - >-
    robots.txt 에 Yeti 를 명시적으로 허용한다 — 이 한 줄은 P1-02 의 산출물이 덮는다.
  - >-
    사이트맵을 제출한다. 등록만으로는 수집 대상이 좁다.
  - >-
    수집 진단의 오류를 해소한다. 대부분 robots 차단이나 응답 오류라 P1-01·P1-07 과 겹친다.

not_verifiable: |
  담당 수집기가 없고 **만들 수 없다.** 판정에 필요한 정보(소유 확인 여부, 사이트맵
  제출 여부, 수집 진단 결과)가 전부 **네이버 웹마스터도구 계정 안에** 있다. 사이트
  밖에서 우리가 볼 수 있는 것은 robots.txt 의 Yeti 허용 한 줄뿐이고, 그건 이 항목이
  요구하는 넷 중 하나다.

  고객 계정에 접근하지 않는다 — 진단 도구가 고객의 외부 서비스 자격증명을 요구하기
  시작하면 그건 다른 종류의 제품이 된다.

adapters:
  - platform: any
    where: "서치어드바이저 콘솔. 코드가 아니라 등록 행위다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없고, 우리 수집기로는 확인할 방법도 없다"
