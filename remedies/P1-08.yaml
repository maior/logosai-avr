  - platform: any
    where: "링크가 놓이는 곳 어디든. 이것은 마크업이 아니라 **정보 구조(IA)** 다 —
      CMS·정적 사이트·수기 HTML 어디서도 같은 일을 한다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다. 담당 수집기가 없어 예시조차
      돌려보지 못했다"
