# P1-08 고아 페이지
#
# **이 처방은 우리가 효과를 확인하지 못한 조언이다.** 담당 수집기가 없어 예시조차
# 돌려볼 수 없다 -- 아래 `not_verifiable` 이 그 사실을 화면까지 끌고 간다. 검증된
# 처방과 똑같이 보이면 안 되기 때문이다.

item_id: P1-08

target_state: |
  sitemap 에 등재된 URL 중 **내부 링크 유입이 하나도 없는 페이지가 5% 미만**이고,
  핵심 랜딩(제품·서비스·FAQ)이 홈에서 3클릭 이내에 있다.

  붙여넣을 것이 없다. 이것은 마크업이 아니라 **링크를 어디에 두는가**의 문제다.
  고아 페이지는 대개 이렇게 생긴다 -- 만들 때는 어딘가에서 링크했는데 그 어딘가가
  개편으로 사라졌거나, 애초에 캠페인용 URL 을 직접 배포만 하고 사이트 안에서는
  아무 데서도 가리키지 않았거나.

  고치는 순서는 링크를 늘리는 것이 아니라 **세는 것부터**다.
    1. sitemap 의 URL 전부를 목록으로 놓는다
    2. 각 URL 을 가리키는 사이트 내부 링크가 하나라도 있는지 센다 (0 이면 고아)
    3. 고아를 셋으로 가른다 — ① 살릴 것(허브 페이지·목록·관련 글에서 링크)
       ② 없앨 것(301 로 합친다) ③ 원래 색인 대상이 아닌 것(sitemap 에서 뺀다)
    4. 핵심 랜딩은 홈에서 3클릭 이내가 되도록 경로를 만든다

  ③ 을 빼먹으면 sitemap 이 부풀고, 부푼 sitemap 은 고아 비율을 실제보다 나쁘게
  보이게 한다. 감사 대상 자체를 정확히 만드는 일이 먼저다.

example: |
  <!-- 허브 페이지 하나가 고아를 없애는 가장 싼 방법이다. 개별 글마다 링크를
       심는 대신, 그 묶음을 가리키는 목록 페이지를 두고 홈에서 그 목록을 링크한다.
       그러면 새 글이 늘어도 링크 구조가 저절로 유지된다. -->
  <h1>재고관리 가이드</h1>
  <p>재고관리 가이드는 도입·운영·점검 세 묶음으로 나뉜다.</p>
  <h2>도입</h2>
  <ul>
    <li><a href="/guides/inventory-checklist">도입 전 체크리스트</a></li>
    <li><a href="/guides/data-migration">엑셀 데이터 이관</a></li>
  </ul>
  <h2>운영</h2>
  <ul>
    <li><a href="/guides/stock-alert">재고 부족 알림 설정</a></li>
    <li><a href="/guides/permissions">권한 나누기</a></li>
  </ul>

# 담당 수집기가 없다. **없는 이유는 "안 하기로 한 것"이 아니라 "아직 못 한 것"이다** --
# 그 차이가 로드맵을 가른다 (P2-01 의 사유와 비교하라).
not_verifiable: |
  담당 수집기가 없다. 고아 페이지 비율은 **사이트 한 장이 아니라 링크 그래프
  전체**를 봐야 나온다 -- sitemap 의 URL 전량(분모)과, 그 URL 을 가리키는 내부
  링크를 찾기 위한 페이지 전량(분자)이 둘 다 필요하다. 지금 감사는 홈 + 대표
  페이지 몇 장만 읽으므로 그 분모도 분자도 만들 수 없고, 만들려면 사이트당 요청
  수가 페이지 수만큼 늘어난다(수백~수천 배). 크롤 예산과 정중함 규칙을 다시 짜야
  하는 일이라 지금은 안 하지만, **언젠가 할 수 있는 종류의 일이다** -- 막는 것은
  방법이 아니라 비용이다.

fixture:
  place: document
  targets: ["/guides"]

