# P2-04 섹션 자기완결성 (청킹 내성)
#
# **이 처방은 붙여넣는 것이 아니다.** 아래 `example` 은 채워진 예시이고, 당신의
# 글은 당신이 써야 한다. 우리가 확인할 수 있는 것은 하나뿐이다 -- 이 **틀이 2점에
# 닿을 수 있다**. 당신 글이 2점이 된다는 뜻이 아니다.

item_id: P2-04

target_state: |
  섹션 첫 문장이 **앞 섹션 의존 지시어**('이것은', '위에서 말한', '해당', '앞서')로
  시작하는 비율이 15% 미만이고, 각 H2 섹션이 브랜드명 또는 주제 명사를 **그 섹션
  안에서 최소 한 번** 명시한다.

  **왜 이게 인용에 관계되는가**: AI 답변 엔진은 문서를 통째로 읽지 않고 조각으로
  잘라 색인한다. 섹션 첫 문장이 "이것은 세 단계로 나뉩니다" 로 시작하면, 그 조각만
  뽑혔을 때 무엇이 세 단계인지 아무도 모른다. 인용될 수 있는 조각이 되려면 조각
  혼자 서야 한다.

  고치는 법은 둘뿐이다.
    · 지시어를 **그 지시어가 가리키는 말로 되돌린다** ("이것은" → "현황 조사는")
    · 섹션마다 주어를 한 번은 제 이름으로 부른다 (대명사로만 이어가지 않는다)

  같은 명사를 반복하는 글은 소리 내 읽으면 어색하다. 그 어색함이 이 항목의 비용이고,
  조각 단위로 읽히는 문서에서는 그 비용을 치를 값어치가 있다는 것이 rubric 의 판단이다.

example: |
  <h1>재고관리 시스템 도입 가이드</h1>
  <p>도입은 세 단계로 나뉜다.</p>
  <h2>현황 조사</h2>
  <p>재고관리 시스템을 도입하기 전에 창고별 품목 수와 입출고 빈도를 센다. 이 수치가 이후 모든 선택의 근거가 된다.</p>
  <h2>데이터 이관</h2>
  <p>기존 엑셀 장부를 CSV 로 내보내 재고관리 시스템에 일괄 등록한다. 품목 코드가 겹치면 등록 전에 정리한다.</p>
  <h2>운영 인수인계</h2>
  <p>도입 4주차에 재고관리 시스템 운영을 현업 담당자에게 넘긴다. 담당자 두 명이 한 주를 함께 보낸다.</p>

not_verifiable: null

verify:
  collector: SectionSelfContainmentCollector
  demonstrates_level: 2
  note: |
    골든 케이스 `remedy-p2-04-example-demonstrates-two` 가 **이 파일을 직접 읽어**
    돌린다. 어느 섹션의 첫 문장을 "이것은…" 으로 바꾸면 의존 비율이 15% 를 넘어
    그 케이스가 빨개진다.

    주제어는 H1 에서 뽑힌다(브랜드명을 수집기가 모르기 때문이다 — rubric 은
    "브랜드명 **또는** 주제 명사" 라고 쓴다). 그래서 예시의 H1 을 바꾸면 각 섹션이
    무엇을 명시해야 하는지도 함께 바뀐다.

