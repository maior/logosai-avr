# P2-02 질문형 헤딩
#
# **이 처방은 붙여넣는 것이 아니다.** 아래 `example` 은 채워진 예시이고, 당신의
# 헤딩은 당신이 써야 한다. 그리고 이 항목은 **예시만으로는 2점에 닿지 않는다** --
# level 2 의 둘째 조건이 사이트 밖(목표 질문 세트)에 있기 때문이다. 아래 `ceiling`
# 이 어디서 멈추는지를 적는다.

item_id: P2-02

target_state: |
  전체 H1/H2 중 **질문형 헤딩이 40% 이상**이고, 목표 질문 세트 상위 20개 중
  10개 이상이 어떤 페이지의 H1/H2 와 어휘 수준에서 대응한다.

  질문형이란 의문사(무엇·어떻게·왜·언제·어디·누가·얼마·몇)를 쓰거나, 물음표로
  끝나거나, '~하는 법'·'~란' 꼴인 헤딩이다.

  **둘째 조건이 본체다.** 헤딩을 물음표로 바꾸기만 하면 첫 조건은 하루면 채워진다.
  그런데 그 질문이 **아무도 묻지 않는 질문**이면 이 항목은 아무것도 하지 않는다.
  그래서 순서가 이렇다 — 먼저 목표 질문 세트를 정하고(우리 제품이 답해야 하는
  질문 20개), 그 다음에 그 질문을 헤딩으로 옮긴다. 반대로 하면 헤딩만 예뻐진다.

example: |
  <h1>재고관리 시스템은 무엇인가</h1>
  <p>재고관리 시스템은 창고의 품목 수량과 위치를 한곳에 기록해 장부와 실물을 맞추는
     소프트웨어다.</p>
  <h2>도입에 얼마나 걸리나요</h2>
  <p>현황 조사 2주, 데이터 이관 1주, 인수인계 1주로 평균 4주가 걸린다.</p>
  <h2>비용은 어떻게 정해지나요</h2>
  <p>사용자 수에 비례한다. 창고 수나 품목 수로는 받지 않는다.</p>
  <h2>엑셀 데이터는 어떻게 옮기나요</h2>
  <p>엑셀을 CSV 로 내보낸 뒤 일괄 등록한다. 품목 코드가 겹치면 등록 전에 정리한다.</p>

not_verifiable: null

verify:
  collector: StructureCollector
  # **천장.** `demonstrates_level` 을 적을 수 없다 -- 아무리 잘 쓴 예시도 자동
  # 판정이 2 에 닿지 않고, 1 을 적으려면 예시를 일부러 나쁘게(질문형 40% 미만으로)
  # 써야 한다. 그건 기준을 낮추는 것이라 하지 않는다.
  demonstrates_unavailable_kind: input_missing
  ceiling: |
    rubric v1.7.0 P2-02 levels."2" 는 두 조건의 **and** 다 — "질문형 헤딩 비율
    40% 이상**이고**, 목표 질문 세트의 상위 20개 중 10개 이상이 어떤 페이지의
    H1/H2 와 어휘 수준에서 대응". 앞 조건은 문서 하나로 확인되지만 뒤 조건의
    **목표 질문 세트는 문서 안에 없다** -- 그건 Plane A 의 입력(무엇을 물어볼
    것인가)이고, 사이트를 아무리 잘 써도 거기서 나오지 않는다.

    그래서 이 예시는 질문형 비율 100% 로 첫 조건을 채운 채 `input_missing` 에서
    멈춘다. 이것을 `demonstrates_level: 2` 로 적으면 거짓이고, 1 로 적으려면
    levels."1"(질문형 10~39%)에 맞춰 예시를 나쁘게 고쳐야 한다.

    **미판정은 0점이 아니다.** ARS 점수 분모에서는 빠지고 `unscored_item_ids` 로
    공시되지만, `input_missing` 은 커버리지 분모에는 **남는다** — 안 잰 것이
    커버리지 이득이 되면 안 되기 때문이다 (spec §8.2·§8.3). 2 로 올리는 길은
    헤딩을 더 고치는 것이 아니라 목표 질문 세트를 정하는 일이고, 그건 붙여넣기가
    아니다.
  note: |
    골든 케이스 `remedy-p2-02-example-stops-at-the-question-set` 이 **이 파일을
    직접 읽어** 돌린다. 예시의 헤딩을 평서문으로 바꾸면 비율이 40% 아래로 떨어져
    판정이 level 0/1 로 내려가고 그 케이스가 빨개진다.

fixture:
  # P2-02 는 홈 한 장의 H1/H2 비율을 본다. 예시가 문서 그 자체이므로 `document` 다 --
  # 러너의 보일러플레이트(`<h1>t</h1>`)가 얹히면 질문형이 아닌 H1 이 분모에 끼어든다.
  place: document
  targets: ["/"]

adapters:
  - platform: any
    where: "헤딩을 쓰는 곳 어디든. 이것은 마크업이 아니라 **무엇을 묻는가**의 선택이다 —
      CMS·정적 사이트·수기 HTML 어디서도 같다"
    status: unconfirmed
    note: "어느 사이트에도 적용해 재진단한 적 없다. 예시가 자동 판정의 천장까지
      간다는 것만 골든 케이스로 확인했다"
