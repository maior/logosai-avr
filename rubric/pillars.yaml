# AVR 모델 — Plane B (Readiness) 채점 정본
# Single Source of Truth. 백엔드 스코어러는 이 파일만 파싱한다.
# 항목 수정 시 framework/schema/report.schema.json 의 id enum 과 함께 갱신할 것.
version: "1.6.0"

changelog:
  - version: "1.6.0"
    date: "2026-09-07"
    breaking: false
    summary: "항목마다 조치 분류(remediation) 필드 신설 — config(3)·dev(17)·content(17)·operations(4)·earned(4), 합계 45. 리포트가 '무엇이 미달인가'는 말해도 '누구를 불러야 하는가'는 말하지 못했다는 결손(경쟁사 비교 분석)을 메운다. 이 파일의 levels·weight·blocking·gating·check 는 변경 없음 — remediation 은 채점에 관여하지 않는 순수 정보 필드다. 파일 상단에 remediation_tiers 어휘 블록(값·뜻·호출 대상)을 신설한다."
    comparability: "v1.5.0 과 총점 완전히 비교 가능 — ARS·raw_ars·pillar 점수·게이팅·커버리지 산식 어디에도 remediation 을 입력으로 쓰지 않는다(backend/tests/test_remediation.py 가 동일 item_scores 에 대해 remediation 유무로 결과가 바뀌지 않음을 실측으로 증명한다). 이름 하나가 45항목에 붙었을 뿐 어떤 진단의 ARS 도 바뀌지 않는다."
  - version: "1.5.0"
    date: "2026-09-05"
    breaking: false
    summary: "unavailable_kind 어휘에 6번째 값 awaiting_manual 신설(정본은 report.schema.json 1.2.0 의 $defs.unavailable_kind) — check:manual 항목(11개: P1-10·P3-08·P4-02~P4-07·P4-09·P5-05·P5-06)의 사람 판정이 아직 없는 상태를 no_collector(로드맵 결손)·input_missing(정식 입력 부재)과 구분한다. 이 파일의 항목(45개)·levels·weight·blocking·gating 데이터는 변경 없음 — awaiting_manual 은 not_applicable·design_limit 과 달리 judgeable 분모에 남으므로 blocking_forbidden_unavailable_kinds 목록에 추가하지 않는다(blocking 2개는 이미 전부 check:auto 이므로 이 값이 원리상 나올 수 없다)."
    comparability: "v1.4.0 과 총점 완전히 비교 가능. 이 값을 명시하지 않은 기존 리포트는 지금도 분모에 남는 것으로 처리되므로(§8.3 '애매하면 남기는 쪽이 기본값') 이름이 하나 붙었을 뿐 어떤 진단의 ARS 도 바뀌지 않는다. awaiting_manual 로 명시한 진단과 kind 를 아예 지정하지 않은 진단은 judgeable·coverage·ARS 가 항상 동일하다(inconclusive 와 산식이 같다)."
  - version: "1.4.0"
    date: "2026-09-05"
    breaking: false
    summary: "gating 규칙에 blocking_forbidden_unavailable_kinds 신설 — blocking 항목(P1-01, P1-03)의 unavailable_kind 로 not_applicable·design_limit 사용을 금지. 커버리지 분모 재정의(judgeable) 자체는 scoring.yaml 1.1.0 이 담당하고 이 파일의 항목(45개)·levels·weight 는 변경 없음"
    comparability: "v1.3.0 과 총점 비교 가능 — 이 변경은 새로 도입된 unavailable_kind 값의 사용 제약만 추가했고(위반 시 422 거부), 45항목 어디에도 levels·weight·blocking 변경이 없다. 커버리지 분모 재정의로 인한 비교 불가 범위는 scoring.yaml 1.1.0 changelog 를 참조 — 그쪽이 실제 점수·Pillar 제외 여부에 영향을 준다."
  - version: "1.3.0"
    date: "2026-09-05"
    breaking: false
    summary: "P5-04 링크 건전성 분모·분자 재정의 — robots 차단/401/403/429/타임아웃/DNS·연결 실패를 'unchecked' 로 분리하고 broken(404·410·5xx) 과 구분. unchecked 50% 초과면 unavailable. P5-07 내부 링크 건전성 신설(P5 6→7항목)"
    comparability: "P5-04 개별 항목은 v1.2.0 과 비교 불가 — 분모가 '전체 외부 링크' 에서 '확인에 성공한 외부 링크' 로 바뀌었다(403·429 등을 더 이상 깨짐으로 세지 않는다). P5 pillar 점수와 총점(ARS)도 비교 불가 — 항목 수가 6→7 로 늘어 Pillar 정규화 분모(max_raw = 2 × 채점 항목 수)가 바뀌었다. 2026-09-05 파일럿 1회차(10곳)는 v1.2.0 으로 측정되었으므로 v1.3.0 과 비교하려면 재측정이 필요하다."
  - version: "1.2.0"
    date: "2026-09-04"
    breaking: false
    summary: "P1-01 오탐 수정 — robots.txt 404 를 0점에서 1점으로. RFC 9309 §2.3.1.3 은 4xx 를 '전체 허용'으로 규정한다"
    comparability: "v1.1.0 과 총점 비교 가능. 단 robots.txt 가 404 인 사이트는 v1.1.0 에서 게이팅(총점 40)에 잘못 걸렸으므로, 그런 사이트의 과거 점수는 재측정해야 한다. 발행된 리포트가 없으므로 실제 영향 없음."
  - version: "1.1.0"
    date: "2026-09-04"
    breaking: false
    summary: "게이팅 규칙 보강 — blocking 항목의 미판정 금지, unavailable(사유 명시) 상태 신설"
    comparability: "v1.0.0 과 총점 비교 가능. 점수 산식은 바뀌지 않았고 입력 검증만 강화되었다. v1.0.0 에서 blocking 항목을 채점한 진단은 v1.1.0 에서 동일한 점수를 낸다."
  - version: "1.0.0"
    date: "2026-09-04"
    breaking: false
    summary: "최초 정의 — 5 Pillar 44항목, 배점 25/25/20/20/10, blocking 2개"
    comparability: "기준선"

# 조치 분류 (remediation) 어휘 — rubric v1.6.0~
#
# 채점은 "무엇이 미달인가"를 말하지만 "누구를 불러야 하는가"는 말하지 못했다.
# 리포트가 작업 목록으로 끝나고 우선순위를 못 주는 결손이었다. 각 항목의
# `remediation` 필드는 채점에 관여하지 않는 순수 정보 필드다(spec plane-b-readiness.md
# §9). 값은 자동화 가능 여부가 아니라 "어떤 종류의 일인가"로 나눈다 — 이 제품은
# 남의 사이트를 직접 고치지 않으므로(중립성이 제품이다) 실행자가 누구인지가
# 자동화 여부보다 실용적인 분류축이다.
remediation_tiers:
  config:
    label: "설정"
    description: "사이트 설정·파일 하나를 바꾸면 끝난다. 오늘 끝난다."
    who: "사이트 관리자"
  dev:
    label: "개발"
    description: "템플릿·코드·인프라를 수정해야 한다."
    who: "개발자"
  content:
    label: "콘텐츠"
    description: "글·자료를 새로 쓰거나 고쳐야 한다."
    who: "콘텐츠 담당"
  operations:
    label: "운영"
    description: "사이트 밖 등록·프로세스·담당자 지정이 필요하다."
    who: "운영·마케팅"
  earned:
    label: "획득"
    description: >-
      남이 해줘야 한다. 살 수 없고 벌어야 한다 — 백링크·언론·제3자 언급을
      "할 일 목록"에 넣으면 고객은 오늘 할 수 없는 것을 오늘 하라는 지시로
      읽는다. 이 항목이 못 하는 일이라고 말해주는 것 자체가 이 티어의 값이다.
    who: "—"

gating:
  max_score_when_blocked: 40   # blocking 항목이 0점이면 총점 상한

  # blocking 항목은 미판정을 허용하지 않는다.
  #
  # 왜: 게이팅은 0점에서만 발동하므로, 항목을 아예 재지 않으면 게이팅을 피할 수 있다.
  # 실측 — P1-01 을 0점으로 재면 ARS 40, 안 재면 ARS 100. 감사를 안 하기로 선택하는
  # 것만으로 60점이 생긴다. 대행사가 자기 고객 리포트를 뽑을 때 이 구멍을 안 쓸 이유가 없다.
  #
  # blocking 항목 2개는 모두 check: auto (기계 판정 가능) 이므로 미판정에 정당한 사유가
  # 거의 없다. 다만 사이트 다운·타임아웃처럼 진짜로 못 재는 경우는 존재하므로,
  # 사유를 명시한 unavailable 상태를 두고 그때만 통과시킨다. 사유 없는 누락은 거부한다.
  require_blocking_scored: true

  # blocking 항목의 unavailable_kind 로 쓸 수 없는 값 (rubric v1.4.0~).
  #
  # 왜: P1-01(AI 크롤러 접근 허용)·P1-03(JS 없이 본문 렌더링)은 모든 사이트에 성립하는
  # 조건이다 — "이 사이트에는 크롤러 접근이라는 개념이 없다"는 상태는 존재하지 않고,
  # 단일 관측으로 렌더링 여부를 못 재는 원리적 한계도 없다. 이 둘을 허용하면 blocking
  # 항목이 judgeable 분모에서 통째로 빠져 게이팅 판정 자체가 성립하지 않는 상태를 만들
  # 수 있다 — require_blocking_scored 가 막으려던 것과 같은 종류의 우회다.
  # 정의는 framework/spec/plane-b-readiness.md §8.5, 값 목록은
  # framework/schema/report.schema.json 의 $defs.unavailable_kind 와 일치해야 한다.
  #
  # awaiting_manual(rubric v1.5.0~)을 여기에 추가하지 않는다 -- 이 값은 judgeable
  # 분모에 남으므로(§8.2) 이미 "분모에서 빼는 값만 금지한다"는 이 목록의 취지 밖이고,
  # blocking 2개(P1-01·P1-03)는 둘 다 check: auto 라서 "사람 판정 대기"라는 상태
  # 자체가 원리상 나올 수 없다 -- 이 파일의 각 항목 check 필드가 이미 그 제약이다.
  blocking_forbidden_unavailable_kinds:
    - not_applicable
    - design_limit

pillars:
  # ==========================================================================
  # P1. 접근성 (Retrievability) — 도달 가능성. 여기가 막히면 나머지는 무의미.
  # ==========================================================================
  - id: P1
    name: 접근성
    name_en: Retrievability
    weight: 25
    items:
      - id: P1-01
        title: AI 크롤러 접근 허용
        description: robots.txt가 주요 AI 크롤러를 차단하지 않는가
        check: auto
        blocking: true
        remediation: config
        levels:
          "0": "robots.txt에 `User-agent: *` + `Disallow: /` 가 있고 AI 봇 개별 허용도 없거나, AI 봇 6종(GPTBot, OAI-SearchBot, ClaudeBot, Claude-SearchBot, PerplexityBot, Google-Extended)이 전부 Disallow / 또는 재시도 후에도 5xx 반환 (RFC 9309 §2.3.1.4: 크롤러가 complete disallow 를 가정해야 함)"
          "1": "일부 AI 봇만 허용. 6종 중 1~5종이 Disallow 이거나, 검색봇(OAI-SearchBot·Claude-SearchBot·PerplexityBot) 중 하나 이상이 차단됨 / 또는 robots.txt 가 404 — RFC 9309 §2.3.1.3 상 크롤러는 전체 접근이 허용되지만, AI 봇에 대한 의도적 정책이 없는 상태이므로 2점은 아니다"
          "2": "답변 인용에 필요한 검색봇 3종(OAI-SearchBot, Claude-SearchBot, PerplexityBot)이 모두 Allow 이고, 학습봇(GPTBot, ClaudeBot, Google-Extended)의 허용/차단이 의도적으로 분리 설정되어 있음"

      - id: P1-02
        title: AI 봇 개별 지시 명시성
        description: robots.txt에 AI 봇을 User-agent 블록으로 개별 선언했는가 (와일드카드 묵시적 허용에 의존하지 않는가)
        check: auto
        blocking: false
        remediation: config
        levels:
          "0": "AI 봇 관련 User-agent 블록이 하나도 없음. `User-agent: *` 규칙에만 의존"
          "1": "AI 봇 User-agent 블록이 1~3개 존재"
          "2": "AI 봇 User-agent 블록이 4개 이상 존재하고, 각 블록에 Allow 또는 Disallow 경로가 명시됨"

      - id: P1-03
        title: JavaScript 없이 본문 렌더링
        description: JS 실행 없이 원본 HTML만으로 본문 텍스트가 노출되는가 (SSR/SSG 여부)
        check: auto
        blocking: true
        remediation: dev
        levels:
          "0": "JS 비활성 상태의 HTML 본문 텍스트가 JS 실행 후 대비 30% 미만. 빈 `<div id=\"root\">` 등 CSR 셸만 반환"
          "1": "JS 비활성 HTML 본문 텍스트가 JS 실행 후 대비 30~79%. 주요 헤딩은 있으나 본문 일부가 클라이언트에서 채워짐"
          "2": "JS 비활성 HTML 본문 텍스트가 JS 실행 후 대비 80% 이상. H1과 첫 문단이 원본 HTML에 그대로 존재"

      - id: P1-04
        title: llms.txt 제공
        description: /llms.txt 로 사이트 구조·핵심 문서 요약을 제공하는가
        check: auto
        blocking: false
        remediation: config
        levels:
          "0": "/llms.txt 가 200으로 응답하지 않음"
          "1": "/llms.txt 는 존재하나 링크 5개 미만이거나 각 링크에 한 줄 설명이 없음"
          "2": "/llms.txt 가 200으로 응답하고, H1 사이트명 + 요약 문단 + 링크 5개 이상 각각 한 줄 설명을 포함"

      - id: P1-05
        title: sitemap.xml 유효성
        description: sitemap이 존재하고 실제 인덱싱 대상 URL을 정확히 담고 있는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "sitemap.xml 부재, 또는 XML 파싱 실패, 또는 robots.txt에 Sitemap 지시자 없음"
          "1": "sitemap 존재하나 lastmod 누락 URL이 50% 초과이거나, 등재 URL 중 non-200 응답이 5% 초과"
          "2": "sitemap이 robots.txt에서 참조되고, 전 URL에 lastmod 존재, non-200 응답 URL 1% 이하"

      - id: P1-06
        title: 서버 응답 속도
        description: 크롤러가 타임아웃 없이 본문을 받아가는가 (TTFB 기준)
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "대표 10개 URL의 중앙값 TTFB가 1500ms 초과, 또는 타임아웃(10s) 발생 URL 존재"
          "1": "중앙값 TTFB 600~1500ms"
          "2": "중앙값 TTFB 600ms 이하이고, 최대값도 2000ms 이하"

      - id: P1-07
        title: 상태코드 건전성
        description: 사이트 내부 링크가 4xx/5xx를 반환하지 않는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "크롤링한 내부 URL 중 4xx/5xx 비율 10% 초과, 또는 5xx가 1건 이상"
          "1": "4xx/5xx 비율 2~10%"
          "2": "4xx/5xx 비율 2% 미만이고 5xx 0건. soft 404(200 응답 + 오류 문구) 없음"

      - id: P1-08
        title: 고아 페이지
        description: sitemap에만 있고 내부 링크로 도달할 수 없는 페이지 비율
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "sitemap 등재 URL 중 내부 링크 유입이 0인 페이지가 20% 초과"
          "1": "고아 페이지 비율 5~20%"
          "2": "고아 페이지 비율 5% 미만이고, 모든 핵심 랜딩(제품·서비스·FAQ)이 3클릭 이내 도달"

      - id: P1-09
        title: 모바일·데스크톱 콘텐츠 일치
        description: 모바일 UA와 데스크톱 UA에 동일 본문이 제공되는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "모바일 UA 본문 텍스트가 데스크톱 대비 70% 미만이거나, 별도 m. 도메인이 canonical 없이 운영됨"
          "1": "본문 일치율 70~94%. 아코디언·더보기로 일부 텍스트가 DOM에서 제거됨"
          "2": "본문 일치율 95% 이상. 접힌 UI도 DOM에는 전문이 존재하고 canonical이 단일"

      - id: P1-10
        title: 네이버 서치어드바이저 등록 및 Yeti 허용
        description: "[한국 특수] 네이버 웹마스터도구 소유 확인과 Yeti(네이버 크롤러) 허용 상태"
        check: manual
        blocking: false
        remediation: operations
        levels:
          "0": "robots.txt에서 Yeti가 Disallow 이거나, 서치어드바이저 사이트 등록이 없음"
          "1": "Yeti 허용 + 사이트 등록은 되어 있으나 사이트맵/RSS 미제출 또는 수집 오류 미해결"
          "2": "Yeti 허용 + 소유 확인 완료 + 사이트맵 제출 + 웹마스터도구 수집 진단에 미해결 오류 0건"

  # ==========================================================================
  # P2. 추출성 (Extractability) — 청크 단위로 잘려도 답이 되는가
  # ==========================================================================
  - id: P2
    name: 추출성
    name_en: Extractability
    weight: 25
    items:
      - id: P2-01
        title: 답변 우선 구조 (answer-first)
        description: 페이지 첫 문단에서 질문의 결론이 먼저 제시되는가
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "핵심 랜딩 페이지의 첫 문단이 인사말·회사 연혁·수식어로 시작하고, 결론 문장이 본문 3문단 이후에 등장"
          "1": "핵심 랜딩의 30~69%에서 첫 문단 2문장 이내에 결론 진술이 존재"
          "2": "핵심 랜딩의 70% 이상에서 H1 직후 첫 문장이 곧 결론이며, 그 문장만 떼어도 질문에 답이 됨"

      - id: P2-02
        title: 질문형 헤딩
        description: H1/H2가 사용자 질의문 형태를 취하는가
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "질문형(의문사·물음표·'~하는 법'·'~란') 헤딩이 전체 H1/H2의 10% 미만"
          "1": "질문형 헤딩 비율 10~39%"
          "2": "질문형 헤딩 비율 40% 이상이고, 목표 질문 세트의 상위 20개 중 10개 이상이 어떤 페이지의 H1/H2와 어휘 수준에서 대응"

      - id: P2-03
        title: 헤딩-본문 일치
        description: 헤딩이 약속한 내용을 바로 다음 본문이 제공하는가
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "헤딩 표제어가 직후 2문단 안에 등장하지 않는 섹션이 40% 초과"
          "1": "미일치 섹션 15~40%"
          "2": "미일치 섹션 15% 미만. 모든 H2가 직후 첫 문장에서 해당 표제어를 다시 언급"

      - id: P2-04
        title: 섹션 자기완결성 (청킹 내성)
        description: 섹션 단독으로 잘라내도 주어·맥락이 복원 가능한가
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "섹션 첫 문장이 '이것은', '위에서 말한' 등 앞 섹션 의존 지시어로 시작하는 비율 40% 초과"
          "1": "앞 섹션 의존 섹션 비율 15~40%"
          "2": "앞 섹션 의존 섹션 15% 미만이고, 각 H2 섹션이 브랜드명 또는 주제 명사를 자체적으로 최소 1회 명시"

      - id: P2-05
        title: 한국어 문장 길이 (어절 기준)
        description: "[한국 특수] 조사·어미 때문에 영어 단어수 기준이 맞지 않아 어절(공백 분리 토큰) 수로 판정"
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "본문 문장 평균 어절 수 25 초과, 또는 40어절 초과 문장이 전체의 15% 초과"
          "1": "평균 어절 수 18~25"
          "2": "평균 어절 수 18 이하이고, 40어절 초과 문장 비율 5% 미만"

      - id: P2-06
        title: 단락 길이
        description: 단락이 2~4문장으로 유지되는가
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "6문장 초과 단락이 전체 단락의 30% 초과"
          "1": "6문장 초과 단락 비율 10~30%"
          "2": "단락의 70% 이상이 2~4문장이고, 6문장 초과 단락 10% 미만"

      - id: P2-07
        title: 표·리스트 사용
        description: 비교·나열 정보가 표 또는 리스트 마크업으로 제공되는가
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "핵심 랜딩에 `<table>`·`<ul>`·`<ol>` 요소가 전무하거나, 비교 정보가 이미지로만 제공됨"
          "1": "일부 페이지에 리스트는 있으나 비교형 콘텐츠에 표가 없음, 또는 표에 `<th>` 헤더 행이 없음"
          "2": "비교·선택형 콘텐츠마다 `<th>` 헤더를 갖춘 표 최소 1개, 절차형 콘텐츠에 `<ol>` 사용, 표 내용이 이미지가 아닌 텍스트"

      - id: P2-08
        title: 정의문 존재
        description: "'X는 ~이다' 형태의 단문 정의가 명시되어 있는가"
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "브랜드·핵심 서비스에 대한 정의문이 사이트 어디에도 없음"
          "1": "정의문은 있으나 페이지마다 표현이 달라, 동일 정의문 일치율이 60% 미만"
          "2": "브랜드 정의 한 문장(30어절 이내)이 홈·About·주요 랜딩에서 동일하게 반복되고, 일치율 60% 이상"

      - id: P2-09
        title: 요약 진술문
        description: 긴 문서 상단에 요약(TL;DR / 핵심 요약) 블록이 있는가
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "1,000어절 초과 문서에 요약 블록이 없음"
          "1": "일부 문서(30~69%)에만 요약 블록 존재"
          "2": "1,000어절 초과 문서의 70% 이상에 3~5개 불릿 또는 3문장 이내 요약 블록이 본문 시작 전에 위치"

      - id: P2-10
        title: 앵커 가능한 구조
        description: 헤딩에 id가 부여되고 목차가 제공되어 섹션 단위 인용이 가능한가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "H2/H3에 id 속성이 없어 섹션 앵커 링크가 불가능"
          "1": "id는 있으나 목차(TOC)가 없거나, id가 자동 생성 해시라 의미를 담지 않음"
          "2": "H2/H3에 의미 있는 슬러그 id가 있고, 장문 문서에 앵커 링크 목차가 제공됨"

  # ==========================================================================
  # P3. 기계가독성 (MachineReadability) — 구조화 데이터와 엔티티 연결
  # ==========================================================================
  - id: P3
    name: 기계가독성
    name_en: MachineReadability
    weight: 20
    items:
      - id: P3-01
        title: Organization 스키마
        description: 조직 엔티티가 JSON-LD로 선언되어 있는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "Organization(또는 하위 타입) JSON-LD가 없음"
          "1": "Organization은 있으나 name·url 외 logo, description, contactPoint 중 2개 이상이 누락"
          "2": "Organization에 name, url, logo, description, contactPoint 또는 address가 모두 존재하고 @id가 부여됨"

      - id: P3-02
        title: WebSite 스키마
        description: 사이트 단위 엔티티와 검색 액션이 선언되어 있는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "WebSite JSON-LD가 없음"
          "1": "WebSite는 있으나 publisher가 Organization @id로 연결되지 않음"
          "2": "WebSite에 name, url, inLanguage가 있고 publisher가 Organization @id를 참조. 사이트 내 검색이 있으면 potentialAction(SearchAction) 포함"

      - id: P3-03
        title: 비즈니스 타입 스키마
        description: Service / Product / LocalBusiness 등 업종에 맞는 타입이 선언되어 있는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "서비스·상품 페이지에 해당 타입 JSON-LD가 없음"
          "1": "일부 페이지(30~69%)에만 존재하거나, 필수 속성(name, description, provider/brand) 중 하나 이상 누락"
          "2": "서비스·상품 페이지의 70% 이상에 타입이 선언되고, provider/brand가 Organization @id를 참조하며, offers 또는 areaServed 같은 업종 필수 속성 포함"

      - id: P3-04
        title: FAQPage 스키마
        description: FAQ 콘텐츠가 FAQPage 마크업으로 제공되는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "FAQ 페이지가 없거나, 있어도 FAQPage JSON-LD가 없음"
          "1": "FAQPage는 있으나 mainEntity 항목이 3개 미만이거나, 화면 표시 텍스트와 마크업 텍스트가 불일치"
          "2": "FAQPage에 mainEntity 5개 이상, 각 Question의 acceptedAnswer가 화면 표시 텍스트와 일치, 질문이 실제 목표 질문 세트에서 유래"

      - id: P3-05
        title: Article/BlogPosting 스키마와 author
        description: 콘텐츠 문서에 저자·발행 정보가 마크업되어 있는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "블로그·가이드 문서에 Article 계열 JSON-LD가 없음"
          "1": "Article은 있으나 author가 문자열이거나 없음, 또는 datePublished 누락"
          "2": "Article에 headline, datePublished, dateModified, author(Person 객체 + url), publisher(Organization @id)가 모두 존재"

      - id: P3-06
        title: 보조 스키마 (HowTo·BreadcrumbList)
        description: 절차형 콘텐츠와 사이트 계층이 마크업되어 있는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "HowTo와 BreadcrumbList 둘 다 없음"
          "1": "둘 중 하나만 존재"
          "2": "절차형 문서에 HowTo(step 3개 이상), 2단계 이상 깊이 페이지에 BreadcrumbList가 모두 존재"

      - id: P3-07
        title: sameAs 엔티티 링크
        description: 조직 엔티티가 외부 권위 식별자에 연결되어 있는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "Organization에 sameAs 배열이 없음"
          "1": "sameAs가 있으나 SNS 계정만 있고 지식베이스(Wikidata·Wikipedia) 또는 기업 데이터베이스(LinkedIn·Crunchbase·국내 잡플래닛/사업자정보) 링크가 없음"
          "2": "sameAs에 지식베이스 1개 이상 + 기업 데이터베이스 1개 이상 포함, 총 4개 이상, 전 링크가 200 응답이며 해당 프로필이 실제 동일 엔티티를 가리킴"

      - id: P3-08
        title: NAP 일관성
        description: "[한국 특수] 상호·주소·전화가 자사 사이트와 네이버 플레이스·구글 비즈니스 프로필에서 문자열 수준으로 일치하는가"
        check: manual
        blocking: false
        remediation: operations
        levels:
          "0": "자사 사이트에 주소·전화 표기가 없거나, 네이버 플레이스·구글 프로필 중 어느 곳과도 일치하지 않음"
          "1": "상호는 일치하나 주소 표기 형식(지번/도로명) 또는 전화번호 표기가 채널 간 불일치"
          "2": "상호·주소·전화가 자사 사이트, 네이버 플레이스, 구글 비즈니스 프로필 3곳에서 문자열 정규화 후 완전 일치하고, PostalAddress 스키마로도 동일하게 선언"

      - id: P3-09
        title: 구조화 데이터 검증 통과
        description: 리치 결과 테스트에서 오류가 없는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "JSON-LD 파싱 오류 또는 필수 속성 누락 오류(error)가 1건 이상"
          "1": "오류 0건이나 경고(warning)가 페이지당 평균 2건 초과"
          "2": "검사 대상 페이지 전체에서 오류 0건, 경고 페이지당 평균 2건 이하"

  # ==========================================================================
  # P4. 권위 (Trust) — 사이트 밖에서 만들어지는 신호
  # ==========================================================================
  - id: P4
    name: 권위
    name_en: Trust
    weight: 20
    items:
      - id: P4-01
        title: 명시적 저자 표기
        description: 콘텐츠에 실명 저자가 표시되고 프로필 페이지로 연결되는가
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "저자 표기가 없거나 '관리자', '편집팀' 등 익명 표기만 존재"
          "1": "실명 저자는 표시되나 프로필 페이지 링크가 없음, 또는 콘텐츠의 30~69%에만 표기"
          "2": "콘텐츠의 70% 이상에 실명 저자가 표기되고, 각 저자가 소개·이력·연락처를 담은 전용 프로필 페이지로 연결됨"

      - id: P4-02
        title: 저자 자격 검증 가능성
        description: 저자의 전문성이 외부에서 검증 가능한 링크로 뒷받침되는가
        check: manual
        blocking: false
        remediation: content
        levels:
          "0": "저자 프로필에 외부 검증 링크가 없음"
          "1": "LinkedIn 등 SNS 링크 1개만 존재"
          "2": "저자 프로필에 자격·소속·경력을 확인할 수 있는 제3자 출처(학회·협회·논문·언론 기고·기업 공식 페이지) 링크가 2개 이상"

      - id: P4-03
        title: 권위 백링크
        description: 신뢰도 높은 외부 도메인에서 링크를 받고 있는가
        check: manual
        blocking: false
        remediation: earned
        levels:
          "0": "자사 소유·보도자료 배포망을 제외한 참조 도메인이 5개 미만"
          "1": "참조 도메인 5~29개이나 업계 매체·기관·교육기관 도메인이 3개 미만"
          "2": "참조 도메인 30개 이상이고, 그중 업계 전문 매체·협회·기관·교육기관 도메인이 5개 이상"

      - id: P4-04
        title: 무링크 브랜드 언급
        description: 링크 없이 브랜드명만 등장하는 제3자 언급이 존재하는가
        check: manual
        blocking: false
        remediation: earned
        levels:
          "0": "자사 채널 외에서 브랜드명 언급이 확인되지 않음"
          "1": "커뮤니티·블로그 언급은 있으나 최근 12개월 내 언급이 10건 미만"
          "2": "최근 12개월 내 제3자 무링크 언급 10건 이상이 서로 다른 5개 이상 출처에 분포"

      - id: P4-05
        title: 제3자 카테고리 정의 일치도
        description: 외부 출처가 자사를 자사가 주장하는 카테고리로 설명하는가
        check: manual
        blocking: false
        remediation: earned
        levels:
          "0": "제3자 출처의 카테고리 서술이 자사 정의문과 전혀 다르거나 서술 자체가 없음"
          "1": "제3자 출처 중 30~69%가 자사 정의와 같은 카테고리 명사를 사용"
          "2": "확인된 제3자 출처의 70% 이상이 자사 정의문의 카테고리 명사를 그대로 사용하고, 상위 3개 출처가 서로 모순되지 않음"

      - id: P4-06
        title: 언론 커버리지
        description: 편집권을 가진 매체의 보도가 존재하는가
        check: manual
        blocking: false
        remediation: earned
        levels:
          "0": "유료 보도자료 배포 외에 매체 기사가 없음"
          "1": "최근 12개월 내 기사 1~4건, 또는 전부 보도자료 전재"
          "2": "최근 12개월 내 5건 이상, 그중 최소 2건이 기자 취재·인터뷰 등 전재가 아닌 원 기사"

      - id: P4-07
        title: 원본 데이터·1차 관점
        description: 다른 곳에서 복제할 수 없는 자체 데이터·조사·사례가 공개되어 있는가
        check: manual
        blocking: false
        remediation: content
        levels:
          "0": "자체 데이터·조사·사례 콘텐츠가 없음. 전부 일반론 요약"
          "1": "사례·후기 형태의 콘텐츠는 있으나 수치·방법론이 없는 서술형"
          "2": "표본 수·측정 기간·방법을 밝힌 자체 조사 또는 정량 사례가 2건 이상 공개되어 있고 인용 가능한 형태(표·수치)로 제공"

      - id: P4-08
        title: About 페이지 명확성
        description: 회사 소개 페이지가 정체성·이력·주체를 명확히 밝히는가
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "About/회사 소개 페이지가 없거나 슬로건만 존재"
          "1": "소개 문단은 있으나 설립 연도, 대표자·팀, 사업자 정보 중 2개 이상 누락"
          "2": "정의문 + 설립 연도 + 대표자 또는 핵심 팀 + 사업자 정보/소재지 + 연락 수단이 모두 명시"

      - id: P4-09
        title: 네이버 생태계 신뢰 신호
        description: "[한국 특수] 네이버 AI 브리핑·AI 탭이 출처로 삼는 채널(블로그·카페·지식iN·뉴스·플레이스)에 브랜드 근거가 축적되어 있는가"
        check: manual
        blocking: false
        remediation: operations
        levels:
          "0": "네이버 채널에 자사 운영 계정도 제3자 언급도 없음"
          "1": "자사 운영 블로그·플레이스는 있으나 최근 6개월 갱신이 없거나, 제3자(카페·지식iN·뉴스) 언급이 없음"
          "2": "자사 네이버 채널이 최근 3개월 내 갱신되고, 카페·지식iN·뉴스 중 2개 이상 유형에서 제3자 언급이 확인됨"

  # ==========================================================================
  # P5. 신선도·운영 (Freshness) — 최신성 신호와 유지 체계
  # ==========================================================================
  - id: P5
    name: 신선도·운영
    name_en: Freshness
    weight: 10
    items:
      - id: P5-01
        title: 발행일 표기
        description: 콘텐츠에 발행일이 사람과 기계 양쪽에 노출되는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "발행일이 화면에도 마크업에도 없음"
          "1": "화면에만 표시되고 datePublished 마크업이 없음(또는 그 반대)"
          "2": "화면 표시 + datePublished(ISO 8601)가 모두 존재하고 두 값이 일치"

      - id: P5-02
        title: 최종수정일 표기
        description: 갱신 이력이 dateModified로 노출되는가
        check: auto
        blocking: false
        remediation: dev
        levels:
          "0": "dateModified가 없음"
          "1": "dateModified가 있으나 본문 변경 없이 빌드마다 자동 갱신되어 datePublished 대비 신뢰할 수 없음"
          "2": "dateModified가 실제 본문 변경 시에만 갱신되고, 화면에도 '최종 수정일'로 표시됨"

      - id: P5-03
        title: 갱신 주기
        description: 콘텐츠가 실제로 주기적으로 갱신되는가
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "전체 콘텐츠의 최신 수정일이 12개월 이상 경과"
          "1": "최근 6개월 내 갱신된 콘텐츠가 전체의 10~39%"
          "2": "최근 6개월 내 갱신된 콘텐츠가 전체의 40% 이상이고, 핵심 랜딩은 최근 3개월 내 갱신"

      - id: P5-04
        title: 깨진 외부 링크
        description: 본문이 인용하는 외부 링크가 살아 있는가
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "확인에 성공한 외부 링크(robots.txt 차단·401·403·429·타임아웃·DNS 실패·연결 실패로 확인하지 못한 링크는 'unchecked' 로 분모·분자 모두에서 제외) 중 상태코드가 404·410·5xx 인 링크(broken) 비율이 10% 초과. 단, 대상 외부 링크 전체 중 unchecked 비율이 50% 초과이면 확인된 표본이 절반에 못 미치므로 이 항목은 판정하지 않는다(unavailable, 사유: unchecked 비율 명시)"
          "1": "확인에 성공한 외부 링크 중 broken(404·410·5xx) 비율 3~10%, 또는 broken 비율이 3% 미만이라도 리다이렉트 체인이 3홉을 초과하는 링크가 1건 이상 존재. (unchecked 비율 50% 이하일 때만 0/1/2 등급을 적용하며, 초과 시 unavailable)"
          "2": "확인에 성공한 외부 링크 중 broken(404·410·5xx) 비율 3% 미만이고, 리다이렉트 체인이 3홉을 초과하는 링크가 0건. (unchecked 비율 50% 이하일 때만 0/1/2 등급을 적용하며, 초과 시 unavailable)"

      - id: P5-05
        title: 변경 이력 기록
        description: 문서 하단 또는 별도 페이지에 무엇이 언제 바뀌었는지 기록하는가
        check: manual
        blocking: false
        remediation: content
        levels:
          "0": "변경 이력 기록이 없음"
          "1": "일부 문서에만 '수정일: YYYY-MM-DD' 수준의 날짜만 기록"
          "2": "핵심 문서에 날짜 + 변경 내용 요약을 담은 변경 이력 블록 또는 제품 changelog 페이지가 운영됨"

      - id: P5-06
        title: 콘텐츠 리뷰 운영 체계
        description: 갱신이 담당자·주기가 정해진 프로세스로 운영되는가
        check: manual
        blocking: false
        remediation: operations
        levels:
          "0": "리뷰 주기·담당자가 정해져 있지 않음"
          "1": "비정기적으로 갱신하나 문서화된 주기나 담당자 지정이 없음"
          "2": "콘텐츠 유형별 리뷰 주기와 담당자가 문서로 정의되어 있고, 최근 1개 주기 내 실제 리뷰 수행 기록이 있음"

      - id: P5-07
        title: 내부 링크 건전성
        description: "본문이 참조하는 내부(같은 호스트. 'www.' 접두사 유무 차이만 동일 호스트로 간주하고, 그 외 서브도메인은 별도 호스트=외부로 본다 — 상세 정의는 plane-b-readiness.md §7.5) 링크가 살아 있는가 — 자기 사이트 안의 링크이므로 P5-04(외부 링크)보다 엄격한 기준을 적용한다. P1-07(상태코드 건전성)은 크롤러가 사이트 구조를 통해 도달한 URL 자체의 상태를 재는 접근성 지표이고, 이 항목은 본문 콘텐츠가 인용·참조하는 링크 대상의 최신성·유지보수 상태를 재는 신선도 지표다. 같은 URL 이라도 관찰 시점(크롤링 vs 본문 링크 검사)과 목적(도달 가능성 vs 콘텐츠 유지보수)이 달라 별도 항목으로 채점한다"
        check: auto
        blocking: false
        remediation: content
        levels:
          "0": "확인에 성공한 내부 링크(robots.txt 차단·401·403·429·타임아웃·DNS 실패·연결 실패로 확인하지 못한 링크는 'unchecked' 로 분모·분자 모두에서 제외) 중 상태코드가 404·410·5xx 인 링크(broken) 비율이 5% 초과. 단, 대상 내부 링크 전체 중 unchecked 비율이 50% 초과이면 확인된 표본이 절반에 못 미치므로 이 항목은 판정하지 않는다(unavailable, 사유: unchecked 비율 명시)"
          "1": "확인에 성공한 내부 링크 중 broken(404·410·5xx) 비율 1~5%, 또는 broken 비율이 1% 미만이라도 리다이렉트 체인이 3홉을 초과하는 링크가 1건 이상 존재. (unchecked 비율 50% 이하일 때만 0/1/2 등급을 적용하며, 초과 시 unavailable)"
          "2": "확인에 성공한 내부 링크 중 broken(404·410·5xx) 비율 1% 미만이고, 리다이렉트 체인이 3홉을 초과하는 링크가 0건. (unchecked 비율 50% 이하일 때만 0/1/2 등급을 적용하며, 초과 시 unavailable)"
